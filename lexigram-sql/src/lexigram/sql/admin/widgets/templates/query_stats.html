<div class="h-full">
    <h6 class="text-sm font-semibold text-muted-foreground mb-2">Query Stats</h6>
    <dl class="grid grid-cols-2 gap-y-1 text-sm mb-0">
      <dt class="text-muted-foreground">Total Queries</dt><dd class="text-foreground text-right">{{ total_queries }}</dd>
      <dt class="text-muted-foreground">Avg Duration</dt><dd class="text-foreground text-right">{{ avg_duration_ms }}ms</dd>
      <dt class="text-muted-foreground">Slow Queries</dt><dd class="text-warning text-right">{{ slow_queries }}</dd>
      <dt class="text-muted-foreground">Errors</dt><dd class="text-destructive text-right">{{ error_count }}</dd>
    </dl>
</div>
