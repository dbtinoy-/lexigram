<div class="card h-100">
  <div class="card-body">
    <h6 class="card-title text-muted">Queue Depth — {{ queue_name }}</h6>
    <div class="metric-value fs-4 fw-bold">{{ depth }}</div>
    {% if max_depth is not none %}
    <div class="progress mt-3" style="height: 8px;">
      <div class="progress-bar" role="progressbar"
           style="width: {{ (depth / max_depth * 100)|round(0) }}%"></div>
    </div>
    <div class="text-end small mt-1">Max: {{ max_depth }}</div>
    {% endif %}
  </div>
</div>
