<div class="card h-100">
  <div class="card-body">
    <h6 class="card-title text-muted">Consumer Lag</h6>
    <div class="metric-value fs-4 fw-bold {% if lag_messages > 100 %}text-warning{% endif %}">{{ lag_messages }}</div>
    <div class="text-muted small mt-2">messages behind (~{{ lag_seconds }}s)</div>
  </div>
</div>
