[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/lexigram",
]

[tool.ruff]
extend = "../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "PYI063",  # `exit()` in protocol stubs — intentional for Protocol return types
    "S301",    # pickle: used intentionally in ML model serialization (registry.py)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/lexigram/ai/governance/audit.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
]

[tool.black]
line-length = 88
target-version = [
    "py311",
]
include = "\\.pyi?$"
extend-exclude = "/(\n  # directories\n  \\.eggs\n  | \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | build\n  | dist\n  | htmlcov\n  | .coverage\n)/\n"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "lexigram",
]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.uv.sources.lexigram]
workspace = true

[tool.uv.sources.lexigram-contracts]
workspace = true

[tool.uv.sources.lexigram-ai-llm]
workspace = true

[tool.uv.sources.lexigram-ai-rag]
workspace = true

[tool.uv.sources.lexigram-testing]
workspace = true

[tool.uv.sources.lexigram-ai-feedback]
workspace = true

[tool.uv.sources.lexigram-ai-session]
workspace = true

[tool.uv.sources.lexigram-ai-skills]
workspace = true

[tool.uv.sources.lexigram-ai-workers]
workspace = true

[tool.uv.sources.lexigram-ai-observability]
workspace = true

[tool.uv.sources.lexigram-vector]
workspace = true

[tool.pytest.ini_options]
addopts = ["--cov=src/lexigram/ai", "--cov-report=html", "--cov-report=term", "--cov-fail-under=60"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]

[project]
name = "lexigram-ai"
version = "0.1.3005"
description = "AI Layer for Lexigram Framework - Native LLM, Vector, RAG integration"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai",
    "llm",
    "rag",
    "vector",
    "agents",
    "framework",
    "intelligence",
    "artificial-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "lexigram>=0.1.1",
    "lexigram-contracts>=0.1.0",
    "lexigram-ai-llm>=0.1.0",
    "lexigram-ai-rag>=0.1.0",
    "lexigram-ai-feedback>=0.1.0",
    "lexigram-ai-observability>=0.1.0",
    "numpy>=1.25.0",
    "starlette>=0.28.0",
    "typer>=0.9.0",
]
authors = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]
maintainers = [
