[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-webhook"
version = "0.1.5008"
description = "Webhook management for the Lexigram Framework — subscription CRUD, delivery tracking, HMAC verification, and dead-letter queue"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
keywords = [
    "lexigram",
    "webhook",
    "delivery",
    "hmac",
    "subscription",
    "framework",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "lexigram>=0.1.4",
    "lexigram-contracts>=0.1.4",
    "httpx>=0.27.0",
    "starlette>=0.28.0",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
sql = ["lexigram-sql>=0.1.4"]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/lexigram-webhook/CHANGELOG.md"

[project.entry-points."lexigram.modules"]
webhook = "lexigram.webhook.module:WebhookModule"

[project.entry-points."lexigram.config"]
webhook = "lexigram.webhook.config:WebhookConfig"

[project.entry-points."lexigram.providers"]
webhook = "lexigram.webhook.di.bundle_provider:WebhookBundleProvider"

[project.entry-points."lexigram.admin.contributors"]
webhook = "lexigram.webhook.admin.contributor:WebhookAdminContributor"

[project.entry-points."lexigram.cli.contributors"]
webhook = "lexigram.webhook.cli.contributor:WebhookCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-contracts = { workspace = true }
lexigram-testing = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-ignore = ["TID251"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short --cov=lexigram.webhook --cov-report=term-missing --cov-fail-under=40"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/examples/*"]
