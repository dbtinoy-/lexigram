[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-vector"
version = "0.1.5008"
description = "Vector store backends for the Lexigram Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lexigram", "vector", "embeddings", "similarity-search", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
dependencies = [
    "aiohttp>=3.9.0",
    "lexigram-contracts>=0.1.4",
    "lexigram>=0.1.4",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pgvector = ["asyncpg>=0.30.0"]
pinecone = ["pinecone-client>=3.0.0"]
qdrant = ["qdrant-client>=1.9.0"]
chroma = ["chromadb>=0.4.0"]
weaviate = ["weaviate-client>=4.0.0"]
embed = ["aiohttp>=3.9.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "numpy>=1.24.0",
]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
all = [
    "lexigram-vector[pgvector]",
    "lexigram-vector[pinecone]",
    "lexigram-vector[qdrant]",
    "lexigram-vector[chroma]",
    "lexigram-vector[weaviate]",
    "lexigram-vector[embed]",
]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "numpy>=1.24.0",
]

[project.entry-points."lexigram.modules"]
vector = "lexigram.vector.module:VectorModule"

[project.entry-points."lexigram.ai.subsystems"]
vector = "lexigram.vector.di.provider:VectorProvider"

[project.entry-points."lexigram.config"]
vector = "lexigram.vector.config:VectorConfig"

[project.entry-points."lexigram.cli.contributors"]
vector = "lexigram.vector.cli.contributor:VectorCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-contracts = { workspace = true }
lexigram-testing = { workspace = true }

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
show_error_codes = true
ignore_missing_imports = false
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = [
        "structlog.*",
        "asyncpg.*",
        "aioredis.*",
        "aiomysql.*",
        "qdrant_client.*",
        "chromadb.*",
        "anthropic.*",
        "openai.*",
        "cohere.*",
        "groq.*",
        "mistralai.*",
        "ollama.*",
        "pinecone.*",
        "meilisearch.*",
        "boto3.*",
        "botocore.*",
        "google.cloud.*",
        "authlib.*",
        "strawberry.*",
        "mkdocs.*",
        "aiohttp.*",
        "aiofiles.*",
        "alembic.*",
        "sqlalchemy.*",
        "pydantic.*",
        "pydantic_settings.*",
        "redis.*",
        "celery.*",
        "kafka.*",
        "aiokafka.*",
        "aio_pika.*",
        "uvicorn.*",
        "starlette.*",
        "httpx.*",
        "tenacity.*",
        "cachetools.*",
        "importlib_metadata.*",
        "pkg_resources.*",
        "cryptography.*",
        "jwt.*",
        "passlib.*",
        "bcrypt.*",
        "yaml.*",
        "toml.*",
        "dotenv.*",
        "orjson.*",
        "msgpack.*",
    ], ignore_missing_imports = true },
]


[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=lexigram.vector",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=40",
]
markers = [
    "integration: mark a test as an integration test",
]
