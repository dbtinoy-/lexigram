[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-resilience"
version = "0.1.5008"
description = "Resilience patterns for the Lexigram Framework (circuit breaker, retry, bulkhead, rate limiting, throttle, fallback)"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "resilience",
    "circuit-breaker",
    "retry",
    "bulkhead",
    "rate-limiting",
    "fault-tolerance",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]
maintainers = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]

# Pure Python + stdlib only — no external I/O libraries required.
dependencies = [
    "lexigram-contracts>=0.1.4",
    "lexigram>=0.1.4",
]

[project.optional-dependencies]
idempotency-redis = ["lexigram-cache>=0.1.4"]
idempotency-database = ["lexigram-sql>=0.1.4"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.0.0",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/CHANGELOG.md"

# Framework packages are composed explicitly by the app module graph; entry-point
# plugin auto-discovery (lexigram.plugins) applies only to packages that register
# a PluginDescriptor under the "lexigram.plugins" entry-point group.
[project.entry-points."lexigram.providers"]
resilience = "lexigram.resilience.di.provider:ResilienceProvider"
idempotency = "lexigram.resilience.idempotency.provider:IdempotencyProvider"
durable_idempotency = "lexigram.resilience.idempotency.durable_provider:DurableIdempotencyProvider"

[project.entry-points."lexigram.cli.contributors"]
resilience = "lexigram.resilience.cli.contributor:ResilienceCliContributor"

[project.entry-points."lexigram.modules"]
resilience = "lexigram.resilience.module:ResilienceModule"

[dependency-groups]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.0.0",
]

[tool.uv.sources.lexigram]
workspace = true

[tool.uv.sources.lexigram-contracts]
workspace = true

[tool.uv.sources.lexigram-testing]
workspace = true

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "RUF022",  # __all__ not sorted — registration order is meaningful
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.pytest.ini_options]
addopts = ["--cov=lexigram.resilience", "--cov-report=term", "--cov-fail-under=50", "--import-mode=importlib"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]
