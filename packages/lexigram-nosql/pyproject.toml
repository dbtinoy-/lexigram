[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-nosql"
version = "0.1.5008"
description = "NoSQL document store support for the Lexigram Framework (MongoDB, DynamoDB, Firestore)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lexigram", "nosql", "mongodb", "document-store", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
dependencies = [
    "lexigram-contracts>=0.1.4",
    "lexigram>=0.1.4",
    "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram-dev"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram-dev/issues"
Changelog = "https://github.com/dbtinoy-/lexigram-dev/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mongodb = ["motor>=3.0", "pymongo>=4.6.0"]
dynamodb = ["aioboto3>=11.0.0"]
firestore = ["google-cloud-firestore>=2.19.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
all = [
    "lexigram-nosql[mongodb]",
    "lexigram-nosql[dynamodb]",
    "lexigram-nosql[firestore]",
]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."lexigram.modules"]
nosql = "lexigram.nosql.module:NoSQLModule"

[project.entry-points."lexigram.config"]
nosql = "lexigram.nosql.config:NoSQLConfig"

[project.entry-points."lexigram.providers"]
nosql = "lexigram.nosql.di.provider:NoSQLProvider"

[project.entry-points."lexigram.cli.contributors"]
nosql = "lexigram.nosql.cli.contributor:NoSqlCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_mongodb: marks tests that require a live MongoDB connection",
]
testpaths = ["tests"]
addopts = [
    "--cov=lexigram.nosql",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=40",
]
