[project]
name = "lexigram-all"
version = "0.1.0"
description = "Meta-package: installs every Lexigram package (core, AI, data, UI, admin, multimedia)."
requires-python = ">=3.10"
dependencies = [
    "lexigram>=0.1.0",
    "lexigram-admin>=0.1.0",
    "lexigram-ai>=0.1.0",
    "lexigram-ai-agents>=0.1.0",
    "lexigram-ai-evaluation>=0.1.0",
    "lexigram-ai-feedback>=0.1.0",
    "lexigram-ai-governance>=0.1.0",
    "lexigram-ai-guard>=0.1.0",
    "lexigram-ai-llm>=0.1.0",
    "lexigram-ai-mcp>=0.1.0",
    "lexigram-ai-memory>=0.1.0",
    "lexigram-ai-observability>=0.1.0",
    "lexigram-ai-prompt>=0.1.0",
    "lexigram-ai-rag>=0.1.0",
    "lexigram-ai-relay>=0.1.0",
    "lexigram-ai-relay-gateway>=0.1.0",
    "lexigram-ai-session>=0.1.0",
    "lexigram-ai-skills>=0.1.0",
    "lexigram-ai-workers>=0.1.0",
    "lexigram-audit>=0.1.0",
    "lexigram-auth>=0.1.0",
    "lexigram-cache>=0.1.0",
    "lexigram-cli>=0.1.0",
    "lexigram-contracts>=0.1.0",
    "lexigram-events>=0.1.0",
    "lexigram-features>=0.1.0",
    "lexigram-graph>=0.1.0",
    "lexigram-graphql>=0.1.0",
    "lexigram-http>=0.1.0",
    "lexigram-monitor>=0.1.0",
    "lexigram-multimedia>=0.1.0",
    "lexigram-multimedia-beat>=0.1.0",
    "lexigram-multimedia-image>=0.1.0",
    "lexigram-multimedia-interpolate>=0.1.0",
    "lexigram-multimedia-music>=0.1.0",
    "lexigram-multimedia-tts>=0.1.0",
    "lexigram-multimedia-upscale>=0.1.0",
    "lexigram-multimedia-video>=0.1.0",
    "lexigram-nosql>=0.1.0",
    "lexigram-notification>=0.1.0",
    "lexigram-queue>=0.1.0",
    "lexigram-resilience>=0.1.0",
    "lexigram-search>=0.1.0",
    "lexigram-secrets>=0.1.0",
    "lexigram-sql>=0.1.0",
    "lexigram-storage>=0.1.0",
    "lexigram-tasks>=0.1.0",
    "lexigram-tenancy>=0.1.0",
    "lexigram-testing>=0.1.0",
    "lexigram-ui>=0.1.0",
    "lexigram-vector>=0.1.0",
    "lexigram-web>=0.1.0",
    "lexigram-webhook>=0.1.0",
    "lexigram-workflow>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram_all"]
