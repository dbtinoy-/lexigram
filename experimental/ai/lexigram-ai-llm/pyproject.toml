[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-ai-llm"
version = "0.1.5002"
description = "LLM client layer for the Lexigram Framework — OpenAI, Anthropic, Ollama, Cohere, Groq, Mistral"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lexigram", "llm", "language-model", "ai", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
dependencies = [
    "lexigram-contracts>=0.1.4",
    "lexigram>=0.1.4",
    "typing-extensions>=4.0.0",
    "aiohttp>=3.9",
    "starlette>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]
[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram-dev"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram-dev/issues"
Changelog = "https://github.com/dbtinoy-/lexigram-dev/blob/main/CHANGELOG.md"

[project.optional-dependencies]
admin = ["lexigram-admin>=0.1.4"]
openai = ["openai>=1.0.0", "tiktoken>=0.5.0"]
anthropic = ["anthropic>=0.20.0"]
ollama = ["ollama>=0.1.0"]
cohere = ["cohere>=4.0.0"]
groq = ["groq>=0.4.0"]
mistral = ["mistralai>=0.1.0"]
prompts = ["jinja2>=3.1.0"]
cache = ["redis>=5.0.0"]
huggingface = ["transformers>=4.30.0"]
structured = ["instructor>=1.0.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
all = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "anthropic>=0.20.0",
    "ollama>=0.1.0",
    "cohere>=4.0.0",
    "groq>=0.4.0",
    "mistralai>=0.1.0",
    "jinja2>=3.1.0",
    "redis>=5.0.0",
    "transformers>=4.30.0",
    "instructor>=1.0.0",
]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."lexigram.admin.contributors"]
ai-llm = "lexigram.ai.llm.admin.contributor:LlmAdminContributor"

[project.entry-points."lexigram.providers"]
llm = "lexigram.ai.llm.di.provider:LLMProvider"

[project.entry-points."lexigram.ai.subsystems"]
llm = "lexigram.ai.llm.di.provider:LLMProvider"

[project.entry-points."lexigram.ai.modules"]
llm = "lexigram.ai.llm.module:LLMModule"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
strict_optional = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = [
        "structlog.*",
        "asyncpg.*",
        "aioredis.*",
        "aiomysql.*",
        "qdrant_client.*",
        "chromadb.*",
        "anthropic.*",
        "openai.*",
        "cohere.*",
        "groq.*",
        "mistralai.*",
        "ollama.*",
        "pinecone.*",
        "meilisearch.*",
        "boto3.*",
        "botocore.*",
        "google.cloud.*",
        "authlib.*",
        "strawberry.*",
        "mkdocs.*",
        "aiohttp.*",
        "aiofiles.*",
        "alembic.*",
        "sqlalchemy.*",
        "pydantic.*",
        "pydantic_settings.*",
        "redis.*",
        "celery.*",
        "kafka.*",
        "aiokafka.*",
        "aio_pika.*",
        "uvicorn.*",
        "starlette.*",
        "httpx.*",
        "tenacity.*",
        "cachetools.*",
        "importlib_metadata.*",
        "pkg_resources.*",
        "cryptography.*",
        "jwt.*",
        "passlib.*",
        "bcrypt.*",
        "yaml.*",
        "toml.*",
        "dotenv.*",
        "orjson.*",
        "msgpack.*",
    ], ignore_missing_imports = true },
]


[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["PYI063"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=lexigram.ai.llm",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=60",
]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]
