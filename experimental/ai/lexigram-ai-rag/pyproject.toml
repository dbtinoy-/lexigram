[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-ai-rag"
version = "0.1.5001"
description = "Retrieval-Augmented Generation (RAG) pipeline for the Lexigram Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lexigram", "rag", "retrieval-augmented-generation", "ai", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
dependencies = [
    "lexigram-contracts>=0.1.4",
    "lexigram>=0.1.4",
    "typing-extensions>=4.0.0",
    "aiofiles>=23.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
]
[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram-dev"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram-dev/issues"
Changelog = "https://github.com/dbtinoy-/lexigram-dev/blob/main/CHANGELOG.md"

[project.optional-dependencies]
audio = [
    "librosa>=0.10.0",
    "mutagen>=1.47.0",
]
video = [
    "opencv-python>=4.8.0",
]
pdf = ["pypdf2>=3.0"]
web = ["beautifulsoup4>=4.12", "aiohttp>=3.9"]
clip = ["transformers>=4.30", "torch>=2.0", "pillow>=10.0.0"]
compression = ["llmlingua>=0.2.0"]
reranking = ["flashrank>=0.2.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
all = ["lexigram-ai-rag[pdf,web,clip,compression,reranking]"]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."lexigram.providers"]
rag = "lexigram.ai.rag.di.provider:RAGProvider"

[project.entry-points."lexigram.ai.subsystems"]
rag = "lexigram.ai.rag.di.provider:RAGProvider"

[project.entry-points."lexigram.ai.modules"]
rag = "lexigram.ai.rag.module:RAGModule"

[project.entry-points."lexigram.config"]
ai-rag = "lexigram.ai.rag.config:RAGConfig"

[project.entry-points."lexigram.chunking.strategies"]
fixed_size = "lexigram.ai.rag.chunking.strategies.fixed_size:FixedSizeChunker"
recursive = "lexigram.ai.rag.chunking.strategies.recursive:RecursiveChunker"
semantic = "lexigram.ai.rag.chunking.strategies.semantic:SemanticChunker"
sliding_window = "lexigram.ai.rag.chunking.strategies.sliding_window:SlidingWindowChunker"
token = "lexigram.ai.rag.chunking.strategies.token:TokenChunker"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-contracts = { workspace = true }
lexigram-testing = { workspace = true }

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
disable_error_code = ["attr-defined", "unused-ignore", "unreachable", "no-untyped-def", "type-arg", "misc", "arg-type", "assignment", "return-value", "override", "call-arg", "no-any-return", "operator", "dict-item", "import-not-found"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
strict = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=lexigram.ai.rag",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=60",
]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]
