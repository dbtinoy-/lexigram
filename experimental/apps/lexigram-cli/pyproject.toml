[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "lexigram-cli"
version = "0.1.5007"
description = "Command-line interface for Lexigram Framework - Project scaffolding, code generation, and development tools"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "cli",
    "command-line",
    "scaffolding",
    "codegen",
    "devtools",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "lexigram>=0.1.4",
    "lexigram-contracts>=0.1.4",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "watchfiles>=0.21.0",
    "shellingham>=1.5.0",
    "pydantic>=2.10.0",
    "aiofiles>=23.0.0",
    "tomli>=2.0.0",
]
authors = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]
maintainers = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]

[project.license]
text = "MIT"

[project.scripts]
lexigram = "lexigram.cli.runtime.main:app"

[project.entry-points."lexigram.cli.contributors"]
core = "lexigram.cli.contributors.core:CoreCliContributor"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
all = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "tomli>=2.4.1",
    "tomli-w>=1.2.0",
]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "B025",  # except clause with duplicate exception — CLI catch patterns
    "PT028",  # pytest.deprecated_call — CLI test patterns
    "S301",  # pickle: not used in admin; broad ignore to reduce noise
    "S607",  # start process with partial executable path — subprocess patterns
    "S701",  # jinja2 with autoescape disabled — template rendering
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]
"**/templates/**/*" = ["N999", "INP001", "ANN", "E", "W"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
# Jinja scaffold directories ({{ package_name }}) are templates, not packages.
exclude = ["(?x)(^|/)templates/"]
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
]

[tool.uv.sources.lexigram-testing]
workspace = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]
addopts = ["--cov=lexigram.cli", "--cov-report=term", "--cov-fail-under=40"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/lexigram",
]
