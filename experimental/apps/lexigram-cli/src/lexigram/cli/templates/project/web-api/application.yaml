# Lexigram Configuration
# See https://docs.lexigram.dev/config for full configuration options

app_name: {{ project_name }}

# Logging configuration
logging:
  level: DEBUG
  format: text

# Web configuration (lexigram-web)
web:
  server:
    host: "127.0.0.1"
    port: 8000
  api_docs:
    enabled: true
    provider: both

# Database configuration (lexigram-sql)
db:
  backend:
    url: "sqlite:///./dev.db"
  pool:
    max_size: 5
