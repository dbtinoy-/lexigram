[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "lexigram-builder"
version = "0.1.7004"
description = "Visual node-canvas application builder that generates standalone Lexigram projects"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "lexigram",
    "builder",
    "codegen",
    "low-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "lexigram>=0.1.4",
    "lexigram-contracts>=0.1.4",
    "lexigram-web>=0.1.2",
    "lexigram-sql>=0.1.4",
]
authors = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]
maintainers = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]

[project.license]
text = "MIT"

[project.entry-points."lexigram.modules"]
builder = "lexigram.builder.module:BuilderModule"

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.0.0",
]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]
all = [
    "lexigram-builder[dev,test]",
]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram-dev"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.0.0",
]
test = [
    "lexigram-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
disallow_untyped_defs = true
warn_return_any = true
strict_equality = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["(?x)(^|/)templates/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "scenario: marks cross-package scenario integration tests",
]
addopts = [
    "--cov=lexigram.builder",
    "--cov-report=term-missing",
    "--cov-fail-under=40",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/lexigram",
]
