[project]
name = "lexigram-admin-plugin-demo"
version = "0.1.0"
description = "Demo admin plugin demonstrating every capability of the contributor system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lexigram>=0.1.0",
    "lexigram-admin>=0.1.0",
    "lexigram-contracts>=0.1.0",
]

[project.entry-points."lexigram.admin.contributors"]
demo = "demo.contributor:DemoContributor"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-admin = { workspace = true }
lexigram-contracts = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--tb=short"]
pythonpath = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]
