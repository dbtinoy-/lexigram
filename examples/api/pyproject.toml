[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-example-api"
version = "0.1.0"
description = "Lexigram REST API reference application — users, auth, todos, events"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "lexigram",
    "example",
    "rest",
    "api",
    "reference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "lexigram>=0.1.0",
    "lexigram-web>=0.1.0",
    "lexigram-auth>=0.1.0",
    "lexigram-sql>=0.1.0",
    "lexigram-cache>=0.1.0",
    "lexigram-events>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
server = [
    "uvicorn[standard]>=0.27.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram_example_api"]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-web = { workspace = true }
lexigram-auth = { workspace = true }
lexigram-sql = { workspace = true }
lexigram-cache = { workspace = true }
lexigram-events = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
mypy_path = ["src"]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
