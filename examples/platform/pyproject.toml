[project]
name = "lexigram-example-platform"
version = "0.1.0"
description = "Lexigram multi-tenant SaaS reference application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lexigram>=0.1.0",
    "lexigram-web>=0.1.0",
    "lexigram-auth>=0.1.0",
    "lexigram-sql>=0.1.0",
    "lexigram-events>=0.1.0",
    "lexigram-features>=0.1.0",
    "lexigram-notification>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram_example_platform"]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-web = { workspace = true }
lexigram-auth = { workspace = true }
lexigram-sql = { workspace = true }
lexigram-events = { workspace = true }
lexigram-features = { workspace = true }
lexigram-notification = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--tb=short"]
pythonpath = ["src"]

[tool.ruff]
extend = "../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["D107"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]
"tests/**" = ["S101"]
