[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-example-ai"
version = "0.1.0"
description = "Lexigram AI pipeline reference application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lexigram>=0.1.0",
    "lexigram-ai-llm>=0.1.0",
    "lexigram-ai-rag>=0.1.0",
    "lexigram-ai-agents>=0.1.0",
    "lexigram-vector>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram_example_ai"]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-ai-llm = { workspace = true }
lexigram-ai-rag = { workspace = true }
lexigram-ai-agents = { workspace = true }
lexigram-vector = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--tb=short"]
pythonpath = ["src"]

[tool.ruff]
extend = "../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["D107"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]
"tests/**" = ["S101"]
