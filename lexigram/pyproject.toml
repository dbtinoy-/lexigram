# =============================================================================
# URLs
# =============================================================================

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/CHANGELOG.md"

# =============================================================================
# Extension Discovery (Entry Points)
# =============================================================================
# Extension packages register themselves here so core can discover them
# at runtime WITHOUT hardcoding their existence.
#
# Each extension's pyproject.toml declares:
#
#   [project.entry-points."lexigram.extensions"]
#   web = "lexigram.web:extension_info"
#
# Core discovers them with:
#
#   from importlib.metadata import entry_points
#   extensions = entry_points(group="lexigram.extensions")

# PluginsModule ships with core so `discovery.auto_discover = true` picks up
# entry-point plugin/provider discovery on every application boot. Explicit
# apps can instead call `app.add_module(PluginsModule.configure())`.

[project.entry-points."lexigram.modules"]
PluginsModule = "lexigram.plugins.module:PluginsModule"

# =============================================================================
# Build Configuration
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

# =============================================================================
# Ruff — Linter & Formatter
# =============================================================================
# Philosophy: The linter is a safety net, not decoration.
# We do NOT globally suppress rules to hide known bugs.
# If a rule fires, we fix the code or justify the exception per-file.

[tool.ruff]
extend = "../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"migrations/**/*" = ["INP001", "E402", "F401", "ANN"]
"src/lexigram/serialization/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "lexigram.serialization.msgpack_serializer"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nh3"
ignore_missing_imports = true
# =============================================================================
# Pytest — Test Configuration
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: mark a test as an integration test",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
    "--cov=lexigram",
    "--cov-report=term",
    "--cov-fail-under=70",
]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]

# =============================================================================
# Coverage — Test Coverage
# =============================================================================

[tool.coverage.run]
source = ["lexigram"]
branch = true
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/_*/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true

[tool.uv.sources]
lexigram-contracts = { workspace = true }

