# =============================================================================
# Lexigram Core — The DI/IoC Foundation
# =============================================================================
# This is the CORE package. It provides:
#   - DI/IoC container
#   - Application lifecycle
#   - Configuration system
#   - Provider protocol
#   - Exception hierarchy
#   - Structured logging foundation
#
# It does NOT contain:
#   - Database code          → lexigram-sql
#   - Auth/JWT/crypto        → lexigram-auth
#   - HTTP/ASGI/routing      → lexigram-web
#   - Message queue / email  → lexigram-queue / lexigram-mailer / lexigram-notification
#   - Any domain-specific feature
#
# Core should be lightweight. `pip install lexigram` should take seconds,
# not minutes, and should not compile C extensions.
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "lexigram"
version = "0.1.3009"
description = "Async-first DI/IoC framework for Python — core package"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = [
    "async",
    "framework",
    "dependency-injection",
    "ioc",
    "provider-pattern",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]
maintainers = [
    { name = "Lexigram Framework Team", email = "team@lexigram.dev" },
]

# =============================================================================
# Core Dependencies — MINIMAL
# =============================================================================
# Every dependency here is pulled in by ALL users and ALL extension packages.
# Add something here ONLY if the DI container, config system, provider
# lifecycle, or exception hierarchy literally cannot function without it.

dependencies = [
    "lexigram-contracts>=0.1.0",
    "orjson>=3.0.0",
    "structlog>=25.1.0",             # Structured logging foundation
    "pydantic>=2.10.0",               # Required: used unconditionally by config, validation
    "jinja2>=3.1.0",
]

# =============================================================================
# Optional Dependencies — Convenience Bundles ONLY
# =============================================================================
# These exist so users can do `pip install lexigram[api]` instead of
# listing extension packages individually. They contain ONLY references
# to extension packages — never raw third-party drivers.

[project.optional-dependencies]

# ── Development ────────────────────────────────────────────────────────

dev = [
    "ruff>=0.11.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "lexigram-monitor>=0.1.1",
]

docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
]

# Security extras — opt-in deps for lexigram.security.* implementations
# HTML sanitization requires nh3 (Rust-based); encryption requires cryptography.
security = [
    "nh3>=0.3.4",
    "cryptography>=41.0.0",
]

# ── Extension Convenience Groups ──────────────────────────────────────
# Users can install entire subsystems via:
#   pip install lexigram[web]     → all web packages
#   pip install lexigram[ai]      → all AI packages
#   pip install lexigram[api]     → web + ai (the demo stack)
#   pip install lexigram[all]     → everything on PyPI

# ── Web & API ─────────────────────────────────────────────────────────

web = [
    "lexigram-web[uvicorn]>=0.1.2",
]

api = [
    "lexigram-web[uvicorn]>=0.1.2",
    "lexigram-ai>=0.1.2",
    "lexigram-ai-llm>=0.1.2",
]

# ── AI Subsystem ──────────────────────────────────────────────────────

ai = [
    "lexigram-ai>=0.1.2",
    "lexigram-ai-llm>=0.1.2",
    "lexigram-ai-agents>=0.1.2",
    "lexigram-ai-rag>=0.1.2",
    "lexigram-ai-mcp>=0.1.2",
    "lexigram-ai-memory>=0.1.2",
    "lexigram-ai-skills>=0.1.2",
    "lexigram-ai-feedback>=0.1.2",
    "lexigram-ai-observability>=0.1.2",
    "lexigram-ai-prompt>=0.1.2",
    "lexigram-ai-session>=0.1.2",
    "lexigram-ai-workers>=0.1.2",
]

# ── Data & Storage ────────────────────────────────────────────────────

db = [
    "lexigram-nosql>=0.1.2",
    "lexigram-storage>=0.1.2",
    "lexigram-search>=0.1.2",
]

cache = [
    "lexigram-cache>=0.1.2",
]

# ── Auth & Security ───────────────────────────────────────────────────

auth = [
    "lexigram-auth>=0.1.2",
    "lexigram-audit>=0.1.2",
]

# ── Events & Tasks ────────────────────────────────────────────────────

events = [
    "lexigram-events>=0.1.2",
]

tasks = [
    "lexigram-tasks>=0.1.2",
]

# ── Observability ─────────────────────────────────────────────────────

monitor = [
    "lexigram-monitor>=0.1.2",
]

# ── UI / Admin ────────────────────────────────────────────────────────

ui = [
    "lexigram-ui>=0.1.2",
]

admin = [
    "lexigram-ui>=0.1.2",
]

# ── GraphQL ───────────────────────────────────────────────────────────

graphql = [
    "lexigram-graphql>=0.1.2",
]

# ── CLI ───────────────────────────────────────────────────────────────

cli = [
    "lexigram-cli>=0.1.2",
    "uvicorn[standard]>=0.27.0",
]

# ── Everything ────────────────────────────────────────────────────────

all = [
    "lexigram-web[uvicorn]>=0.1.2",
    "lexigram-ai>=0.1.2",
    "lexigram-ai-llm>=0.1.2",
    "lexigram-ai-agents>=0.1.2",
    "lexigram-ai-rag>=0.1.2",
    "lexigram-ai-mcp>=0.1.2",
    "lexigram-ai-memory>=0.1.2",
    "lexigram-ai-skills>=0.1.2",
    "lexigram-ai-feedback>=0.1.2",
    "lexigram-ai-observability>=0.1.2",
    "lexigram-ai-prompt>=0.1.2",
    "lexigram-ai-session>=0.1.2",
    "lexigram-ai-workers>=0.1.2",
    "lexigram-nosql>=0.1.2",
    "lexigram-storage>=0.1.2",
    "lexigram-search>=0.1.2",
    "lexigram-cache>=0.1.2",
    "lexigram-auth>=0.1.2",
    "lexigram-audit>=0.1.2",
    "lexigram-events>=0.1.2",
    "lexigram-tasks>=0.1.2",
    "lexigram-monitor>=0.1.2",
    "lexigram-ui>=0.1.2",
    "lexigram-graphql>=0.1.2",
    "lexigram-cli>=0.1.2",
