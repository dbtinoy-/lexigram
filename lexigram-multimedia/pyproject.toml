[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-multimedia"
version = "0.1.3005"
description = "Audio/video/image generation orchestrator for the Lexigram Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lexigram", "multimedia", "audio", "video", "image", "generation", "ai", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
dependencies = [
    "lexigram>=0.1.1",
    "lexigram-contracts>=0.1.0",
    "lexigram-multimedia-tts>=0.1.0",
    "lexigram-multimedia-music>=0.1.0",
    "lexigram-multimedia-video>=0.1.0",
    "lexigram-multimedia-image>=0.1.0",
    "lexigram-multimedia-upscale>=0.1.0",
    "lexigram-multimedia-interpolate>=0.1.0",
    "lexigram-multimedia-beat>=0.1.0",
    "lexigram-tasks>=0.1.0",
    "lexigram-storage>=0.1.0",
]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram-multimedia-experimental"
Issues = "https://github.com/dbtinoy-/lexigram-multimedia-experimental/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "lexigram-testing>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."lexigram.modules"]
multimedia = "lexigram.multimedia.module:MultimediaModule"

[project.entry-points."lexigram.config"]
multimedia = "lexigram.multimedia.config:MultimediaConfig"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [{ module = "tests.*", ignore_errors = true }]

[tool.ruff]
extend = "../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["PYI063"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_postgres: marks tests that require a live PostgreSQL connection",
]
addopts = [
    "--cov=lexigram.multimedia",
    "--cov-config=pyproject.toml",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=40",
]

# The lexigram.multimedia import name is a namespace shared with the sibling
# wheel packages (lexigram-multimedia-tts/-music/-image/-video,
# installed into the same site-packages tree). Without scoping, coverage
# measures the siblings' sources too — which this package's test suite does
# not own. The siblings enforce their own coverage gates (see their
# pyprojects, e.g. --cov=lexigram.multimedia.video); this one measures only
# the umbrella's own code. (include is ignored by coverage when --source is
# set, so this uses omit.)
[tool.coverage.run]
omit = [
    "*/lexigram-multimedia-music/src/*",
    "*/lexigram-multimedia-tts/src/*",
    "*/lexigram-multimedia-image/src/*",
    "*/lexigram-multimedia-video/src/*",
    "*/lexigram-multimedia-upscale/src/*",
    "*/lexigram-multimedia-interpolate/src/*",
    "*/lexigram-multimedia-beat/src/*",
]
