[project]
name = "{{ project_name }}"
version = "0.1.0"
description = "Full-stack application built with Lexigram"
requires-python = ">=3.11"
dependencies = [
    "lexigram",
    "lexigram-web",
    "lexigram-sql",
    "lexigram-cache",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ package_name }}"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
