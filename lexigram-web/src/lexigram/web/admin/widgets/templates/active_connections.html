<div class="h-full">
    <div class="mb-3">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-muted-foreground">Active Connections</span>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary text-primary-foreground">{{ active }}</span>
        </div>
        <div class="w-full bg-muted rounded h-2 overflow-hidden">
            {% set percentage = (active / max_allowed * 100) | round(1) %}
            <div class="h-full bg-primary rounded transition-all duration-500" role="progressbar"
                 style="width: {{ percentage }}%;"
                 aria-valuenow="{{ active }}"
                 aria-valuemin="0"
                 aria-valuemax="{{ max_allowed }}"></div>
        </div>
        <small class="text-xs text-muted-foreground block mt-1">{{ active }} / {{ max_allowed }}</small>
    </div>
    <hr class="my-3 border-border">
    <dl class="grid grid-cols-2 gap-y-1 text-sm">
        <dt class="text-muted-foreground">Peak:</dt>
        <dd class="text-foreground text-right">{{ peak }}</dd>
        <dt class="text-muted-foreground">Max Allowed:</dt>
        <dd class="text-foreground text-right">{{ max_allowed }}</dd>
    </dl>
</div>
