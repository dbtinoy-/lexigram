<div class="h-full">
    <div class="grid grid-cols-2 gap-3">
        <div class="text-center">
            <p class="text-xs text-muted-foreground mb-1">Requests/Second</p>
            <h4 class="mb-0 text-lg font-bold text-foreground">{{ requests_per_second }}</h4>
        </div>
        <div class="text-center">
            <p class="text-xs text-muted-foreground mb-1">Error Rate</p>
            <h4 class="mb-0 text-lg font-bold">
                {% if error_rate_pct > 5 %}
                    <span class="text-destructive">{{ error_rate_pct }}%</span>
                {% elif error_rate_pct > 1 %}
                    <span class="text-warning">{{ error_rate_pct }}%</span>
                {% else %}
                    <span class="text-success">{{ error_rate_pct }}%</span>
                {% endif %}
            </h4>
        </div>
    </div>
    <hr class="my-3 border-border">
    <dl class="grid grid-cols-2 gap-y-1 text-sm">
        <dt class="text-muted-foreground">Total Requests:</dt>
        <dd class="text-foreground text-right">{{ total_requests }}</dd>
    </dl>
</div>
