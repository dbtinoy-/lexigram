<div class="h-full">
    <div class="flex items-center justify-between mb-2">
        <div>
            <p class="text-xs text-muted-foreground mb-1">Server Status</p>
            {% if is_running %}
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-success text-success-foreground">Running</span>
            {% else %}
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-destructive text-destructive-foreground">Offline</span>
            {% endif %}
        </div>
    </div>
    <hr class="my-3 border-border">
    <dl class="grid grid-cols-2 gap-y-1 text-sm">
        <dt class="text-muted-foreground">Uptime:</dt>
        <dd class="text-foreground text-right">{{ (uptime_seconds / 3600) | round(2) }} hours</dd>
        <dt class="text-muted-foreground">Version:</dt>
        <dd class="text-foreground text-right">{{ server_version }}</dd>
    </dl>
</div>
