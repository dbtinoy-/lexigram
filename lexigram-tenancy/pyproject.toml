[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-tenancy"
version = "0.1.3006"
description = "Multi-tenant resolution, lifecycle, and isolation for the Lexigram Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lexigram", "multi-tenancy", "saas", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
dependencies = [
    "lexigram>=0.1.1",
    "lexigram-contracts>=0.1.0",
    "typing-extensions>=4.0.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram"
Documentation = "https://docs.lexigram.dev"
Issues = "https://github.com/dbtinoy-/lexigram/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sql = ["lexigram-sql>=0.1.1"]
test = [
    "lexigram-testing>=0.1.1",
    "lexigram-workflow>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
all = ["lexigram-tenancy[sql,test,dev]"]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.1",
    "lexigram-workflow>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."lexigram.modules"]
TenancyModule = "lexigram.tenancy.module:TenancyModule"

[project.entry-points."lexigram.config"]
tenancy = "lexigram.tenancy.config:TenancyConfig"

[project.entry-points."lexigram.providers"]
tenancy = "lexigram.tenancy.di.provider:TenancyProvider"

[project.entry-points."lexigram.cli.contributors"]
tenancy = "lexigram.tenancy.cli.contributor:TenancyCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-contracts = { workspace = true }
lexigram-testing = { workspace = true }
lexigram-workflow = { workspace = true }

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
show_error_codes = true
disallow_any_generics = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.ruff]
extend = "../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["F822"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F822", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=lexigram.tenancy",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=60",
]
