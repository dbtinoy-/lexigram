name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed groups
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      packages: ${{ steps.filter.outputs.packages }}
      ai: ${{ steps.filter.outputs.ai }}
      multimedia: ${{ steps.filter.outputs.multimedia }}
      apps: ${{ steps.filter.outputs.apps }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes by group
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: 'core/**'
            packages: 'packages/**'
            ai: 'experimental/ai/**'
            multimedia: 'experimental/multimedia/**'
            apps: 'experimental/apps/**'
            shared: 'pyproject.toml|uv.lock|Makefile|dev/**|.github/**'

  quality:
    name: Quality gate (format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: format (ruff check --format)
        run: uv run ruff format --check .

      - name: lint (ruff check)
        run: uv run ruff check .

      - name: Tier boundary
        run: uv run python dev/check_tier_boundary.py --root .

      - name: Dependency pin guard
        run: uv run python dev/check_dep_pins.py --root .

      - name: env.example coverage
        run: uv run python dev/check_env_example.py --root .

      - name: typecheck (mypy core)
        run: uv run mypy core/lexigram/src/

  tests:
    name: tests (${{ matrix.group }})
    needs: changes
    # core or shared changing runs the full matrix (core is depended on by
    # every other package); otherwise each group runs on its own filter.
    # workflow_dispatch has no base diff, so it always runs everything.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs[matrix.group] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [core, packages, ai, multimedia, apps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: test (${{ matrix.group }})
        shell: bash
        run: |
          set -euo pipefail
          # DESELECT, re-keyed on tier-root paths: runs root at the tier root,
          # so node ids are <tier>/<package>/tests/...
          case "${{ matrix.group }}" in
            packages)
              # Time-of-day dependent: fail only during the 23:00 UTC
              # business-hours window
              DESELECT="--deselect packages/lexigram-monitor/tests/unit/test_channel_dispatchers.py::TestSlackBusinessHoursDispatcher::test_queues_outside_business_hours --deselect packages/lexigram-monitor/tests/unit/test_channel_dispatchers.py::TestSlackBusinessHoursDispatcher::test_flush_queue_sends_queued --deselect packages/lexigram-nosql/tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_creates_file --deselect packages/lexigram-nosql/tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_no_force_skips_existing --deselect packages/lexigram-nosql/tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_with_fields_str --deselect packages/lexigram-queue/tests/unit/test_message_consumer_generator.py::test_message_consumer_generator_fields"
              ;;
            *)
              DESELECT=""
              ;;
          esac
          uv run pytest -q -m "not integration" --no-cov "${{ matrix.group }}" $DESELECT

  integration:
    name: Integration scenarios (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: Start backing services (postgres, redis)
        run: |
          docker compose -f tests/docker-compose.yml --profile core up -d
          ./tests/wait-for-services.sh

      - name: integration scenarios
        shell: bash
        env:
          ADMIN_SETUP_TOKEN: ci-integration-token
        run: |
          timeout 480 uv run pytest tests/integration/scenarios -m integration --no-cov -q

  coverage:
    name: Coverage gate (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: test coverage (aggregate, floor 70)
        run: |
          uv run pytest -m "not integration and not slow" --cov --cov-fail-under=70

  example:
    name: Demos gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install demo app (locked)
        working-directory: demos/fullstack-demo
        run: uv sync --locked

      - name: format (ruff check --format)
        working-directory: demos/fullstack-demo
        run: uv run ruff format --check src tests

      - name: lint (ruff check)
        working-directory: demos/fullstack-demo
        run: uv run ruff check src tests

      - name: typecheck (demo)
        working-directory: demos/fullstack-demo
        run: uv run mypy

      - name: test (demo, non-integration)
        working-directory: demos/fullstack-demo
        run: uv run pytest -q -m "not integration"

      - name: test (demo suites, workspace env)
        run: uv run pytest -q -m "not integration" --no-cov demos/event-driven-orders/tests demos/realtime-monitor/tests

      - name: compile (llm-experiment scripts)
        run: uv run python -m compileall -q demos/llm-experiment demos/event-driven-orders demos/realtime-monitor

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: audit (pip-audit)
        run: uv run pip-audit