# .github/workflows/ci.yml
name: Lexigram Admin CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  admin-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-extras --dev
      - name: Contracts lint/type/test
        working-directory: lexigram-contracts
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/
          uv run pytest --tb=short
      - name: Admin lint/type/test
        working-directory: lexigram-admin
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/
          uv run pytest --tb=short --cov-fail-under=60
