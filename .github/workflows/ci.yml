name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (format, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --all-extras --locked

      - name: format (ruff check --format)
        run: uv run ruff format --check .

      - name: lint (ruff check)
        run: uv run ruff check .

      - name: Tier boundary
        run: uv run python scripts/check_tier_boundary.py --root .

      - name: Dependency pin guard
        run: uv run python scripts/check_dep_pins.py --root .

      - name: env.example coverage
        run: uv run python scripts/check_env_example.py --root .

      - name: typecheck (mypy core)
        run: uv run mypy lexigram/src/

      - name: test (per workspace member)
        shell: bash
        run: |
          set -euo pipefail
          # Workspace members are derived from the shared inventory helper so CI
          # and the scripts agree on one definition of "what is a package".
          MEMBERS=$(uv run python -c "
          from pathlib import Path
          from scripts.core.package_inventory import discover_package_paths
          print(' '.join(str(p) for p in discover_package_paths(Path('.'))))
          ")
          declare -A DESELECT
          # Per-package runs root at the package dir, so node ids are
          # package-relative (tests/unit/...).
          # Time-of-day dependent: fail only during the 23:00 UTC business-hours window
          DESELECT[lexigram-monitor]="--deselect tests/unit/test_channel_dispatchers.py::TestSlackBusinessHoursDispatcher::test_queues_outside_business_hours --deselect tests/unit/test_channel_dispatchers.py::TestSlackBusinessHoursDispatcher::test_flush_queue_sends_queued"
          # Require the private-only lexigram-cli templates package
          DESELECT[lexigram-nosql]="--deselect tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_creates_file --deselect tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_no_force_skips_existing --deselect tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_with_fields_str"
          DESELECT[lexigram-queue]="--deselect tests/unit/test_message_consumer_generator.py::test_message_consumer_generator_fields"
          for p in $MEMBERS; do
            if [ ! -d "$p/tests" ]; then
              continue
            fi
            key="$(basename "$p")"
            # Scoped runs have no coverage floor (floors apply to
            # aggregate runs from the repo root); pass/fail is the gate.
            uv run pytest -q -m "not integration" --no-cov "$p/tests" ${DESELECT[$key]:-}
          done

  integration:
    name: Integration scenarios (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --all-extras --locked

      - name: Start backing services (postgres, redis)
        run: |
          docker compose -f tests/docker-compose.yml --profile core up -d
          ./tests/wait-for-services.sh

      - name: integration scenarios
        shell: bash
        env:
          ADMIN_SETUP_TOKEN: ci-integration-token
        run: |
          timeout 480 uv run pytest tests/integration/scenarios -m integration --no-cov -q

  coverage:
    name: Coverage gate (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --all-extras --locked

      - name: test coverage (aggregate, floor 70)
        run: |
          uv run pytest -m "not integration and not slow" --cov --cov-fail-under=70

  example:
    name: Demos gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install demo app (locked)
        working-directory: demos/fullstack-demo
        run: uv sync --locked

      - name: format (ruff check --format)
        working-directory: demos/fullstack-demo
        run: uv run ruff format --check src tests

      - name: lint (ruff check)
        working-directory: demos/fullstack-demo
        run: uv run ruff check src tests

      - name: typecheck (demo)
        working-directory: demos/fullstack-demo
        run: uv run mypy

      - name: test (demo, non-integration)
        working-directory: demos/fullstack-demo
        run: uv run pytest -q -m "not integration"

      - name: test (demo suites, workspace env)
        run: uv run pytest -q -m "not integration" --no-cov demos/event-driven-orders/tests demos/realtime-monitor/tests

      - name: compile (llm-experiment scripts)
        run: uv run python -m compileall -q demos/llm-experiment demos/event-driven-orders demos/realtime-monitor

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --all-extras --locked

      - name: audit (pip-audit)
        run: uv run pip-audit
