# ==============================================================================
# application.example.yaml
# Lexigram Framework — complete configuration reference.
#
# All values shown are exact defaults taken from each package's config class.
# Secrets:  prefer environment variables or a vault over plaintext.
#           Syntax: "${ENV_VAR_NAME}" lets the loader substitute at runtime.
# Env-var overrides use double-underscore nesting, e.g.:
#   LEX_WEB__SERVER__PORT=9000  →  web.server.port = 9000
# ==============================================================================

# ── Core Framework (lexigram) ──────────────────────────────────────────────────
# config_section: root (folded by LexigramConfig._fold_lexigram_env_section)
# Core config fields live at the root level of the YAML.
app_name: "lexigram-app"
debug: false
env: development
logging:
  level: info
  format: json
modules: []
discovery:
  auto_discover: true
  package_patterns:
    - "lexigram_*"
health:
  enabled: true
  path: /health
  detailed: false

# ── Admin (lexigram-admin) ─────────────────────────────────────────────────────
# env_prefix: LEX_ADMIN__
admin:
  api_prefix: "/admin/api"  # —
  audit:
    read_audit_enabled: false  # Log read operations (off by default; compliance mode only).
  auth:
    csrf_token_lifetime: 3600  # CSRF token expiry in seconds
    email_otp:
      enabled: true  # Enable email OTP factor
      resend_cooldown_seconds: 60  # Minimum seconds between email OTP sends
      ttl_minutes: 10  # Code validity window in minutes
    email_verification:
      enabled: true  # Enable email verification flow
      enforcement: true  # Block login until the email is verified
      token_ttl_hours: 24  # Verify link validity in hours
    enabled: true  # Enable authentication
    env: "development"  # Deployment environment for cookie security defaults
    idle_timeout: 3600  # Session idle timeout in seconds
    login_url: "/admin/login"  # —
    logout_url: "/admin/logout"  # —
    mfa:
      enabled: true  # Enable TOTP 2FA
      factor: "totp"  # Second factor used at login: 'totp' (authenticator app) or 'email' (one-time ...
      issuer: "Lexigram Admin"  # TOTP issuer label shown in authenticator apps
      skew: 1  # Allowed clock skew in 30 second steps
    oauth_enabled: false  # —
    oauth_providers: null  # —
    password_policy:
      max_length: 128  # —
      min_length: 12  # —
      reject_common_passwords: true  # —
      reject_containing_email: true  # —
      require_digit: true  # —
      require_lowercase: true  # —
      require_special: true  # —
      require_uppercase: true  # —
    permission_cache_ttl: 300  # —
    principal_source: "internal"  # —
    registration:
      allowed_email_domains: null  # Restrict registration to these email domains (empty = any)
      default_role: "admin"  # Role granted to new accounts
      enabled: false  # Allow self-service registration
    roles: null  # —
    security:
      ip_rate_limit_enabled: true  # —
      ip_rate_limit_per_15_minutes: 30  # —
      ip_rate_limit_per_hour: 60  # —
      ip_rate_limit_per_minute: 10  # —
      lockout_thresholds: null  # —
      permanent_lockout_threshold: 50  # —
      setup_token: "${LEX_ADMIN__AUTH__SECURITY__SETUP_TOKEN}"  # Optional ADMIN_SETUP_TOKEN — when set, must be provided during first-run setup.
      setup_token_optin_unsafe: false  # Explicit escape hatch: boot without a setup token. Only for local/ephemeral e...
    session_lifetime: 86400  # —
    session_secret: "${LEX_ADMIN__AUTH__SESSION_SECRET}"  # Session secret for signing
    users: null  # —
  clusters:
    extra: null  # Extra clusters beyond the built-in infrastructure cluster
  commands: null  # —
  contributor_collision_mode: "warn"  # How to handle name collisions when multiple contributors register widgets, pa...
  contributors: null  # —
  dashboard_layout:
    layout: "grid"  # —
    max_widgets: 20  # —
    widget_refresh_default: 30  # —
  data:
    query_timeout_seconds: 5  # —
  debug: false  # —
  enabled: true  # —
  extensions: null  # —
  features:
    activity_feed: false  # —
    api_docs: true  # —
    audit_logging: true  # —
    autosave: false  # —
    command_palette: true  # —
    keyboard_shortcuts: true  # —
    notifications: true  # —
    optimistic_updates: true  # —
    search: true  # —
    theme_toggle: true  # —
    undo_redo: true  # —
    webhooks: false  # —
  form_defaults: null  # —
  framework_pages:
    enabled: true  # —
    require_permission: "admin:framework:access"  # —
  htmx_prefix: "/admin/htmx"  # —
  integrations:
    cache:
      default_ttl_seconds: 60  # —
      enabled: true  # —
      key_prefix: "admin"  # —
    enabled: true  # —
    features:
      enabled: true  # —
    monitor:
      enabled: true  # —
    resilience:
      circuit_failure_threshold: 5  # —
      enabled: true  # —
      retry_max_attempts: 3  # —
    search:
      enabled: true  # —
      fallback_to_like: true  # —
    storage:
      enabled: true  # —
      presigned_url_expiry: 3600  # —
    tasks:
      bulk_threshold: 25  # —
      enabled: true  # —
  name: "admin"  # —
  navigation_groups: null  # —
  observability:
    high_cardinality_labels_enabled: false  # —
    metrics_enabled: true  # —
  prefix: "/admin"  # —
  rate_limit:
    bulk_per_minute: 5  # —
    burst_size: 10  # —
    create_per_minute: 30  # —
    delete_per_minute: 20  # —
    enabled: true  # —
    requests_per_hour: 1000  # —
    requests_per_minute: 60  # —
    update_per_minute: 60  # —
  rbac:
    super_admin_role: "superadmin"  # already special-cased by settings/widgets/impersonation.
  require_auth: true  # —
  resource_defaults: null  # —
  resources: null  # —
  static_dir: null  # —
  static_prefix: "/admin/static"  # —
  strict_resource_resolution: true  # When True (production default), resource/controller resolution failures durin...
  table_defaults: null  # —
  templates_dir: null  # —
  tenancy:
    cookie_name: "admin_tenant"  # —
    default_tenant_id: null  # —
    enabled: false  # —
    header_name: "x-tenant-id"  # —
    route_prefix_template: null  # —
    tenant_field: "tenant_id"  # —
  title: "Lexigram Admin"  # —
  ui:
    content_max_width: null  # —
    favicon_url: null  # —
    logo_url: null  # —
    primary_color: "#6B7280"  # —
    sidebar_collapsed_width: 64  # —
    sidebar_width: 256  # —
    theme: "system"  # —

# ── AI (lexigram-ai) ───────────────────────────────────────────────────────────
# env_prefix: LEX_AI__
ai:
  enabled: true  # Enable AI features
  governance: null  # AI governance configuration
  llm: null  # LLM configuration (optional)
  name: "ai"  # Configuration name
  observability: null  # AI observability configuration (tracing and metrics)
  rag: null  # RAG pipeline configuration (optional)
  subsystems: null  # Dynamic configuration for third-party AI subsystems discovered via entry poin...
  vector: null  # Vector store configuration

# ── AI Agents (lexigram-ai-agents) ─────────────────────────────────────────────
# env_prefix: LEX_AI_AGENTS__
ai_agents:
  default_max_tokens: 2048  # Default max tokens for LLM responses
  default_temperature: 0.7  # Default temperature for LLM calls
  enable_metrics: true  # Enable Prometheus metrics
  enable_tracing: true  # Enable OpenTelemetry tracing
  enabled: true  # Enable the AI agents subsystem
  max_iterations: 10  # Maximum reasoning iterations per execution
  tool_max_retries: 3  # Number of retries for transient tool execution errors (ConnectionError, Timeo...

# ── AI Evaluation (lexigram-ai-evaluation) ─────────────────────────────────────
# env_prefix: LEX_AI_EVALUATION__
ai_evaluation:
  default_seed: null  # Default seed for reproducible experiment runs
  default_threshold: 0.8  # Default score threshold for passing evaluations
  embedding_model: "text-embedding-3-small"  # Model to use for embedding-based evaluations
  enabled: true  # Enable the AI evaluation subsystem
  experiment_dir: null  # Base directory for experiment tracking and checkpoint artifacts
  include_metadata: true  # Whether to include metadata in run reports
  max_retries: 3  # Maximum retries for failed evaluations
  max_samples: null  # Maximum number of samples per evaluation run
  timeout_seconds: 30  # Timeout for evaluation execution in seconds

# ── AI Feedback (lexigram-ai-feedback) ─────────────────────────────────────────
# env_prefix: LEX_AI_FEEDBACK__
ai_feedback:
  async_processing: true  # Process feedback handlers asynchronously in the background
  enabled: true  # Master on/off switch for all feedback collection
  store_raw_payloads: false  # Persist raw incoming feedback payloads for auditing

# ── AI Governance (lexigram-ai-governance) ─────────────────────────────────────
# env_prefix: LEX_AI_GOVERNANCE__
ai_governance:
  enabled: true  # Enable AI governance
  enforce_budget: true  # Enforce budget limits
  fail_open_on_persistence_error: false  # Allow requests when the persistence backend is unavailable. When False (defau...
  max_request_cost: null  # Maximum cost in dollars for a single request. Requests with an estimated cost...
  max_tokens_per_request: null  # Max tokens per request
  monthly_budget: null  # Monthly budget in dollars
  resource_units: null  # Resource units this governance instance tracks. Per-tenant limits are configu...
  restricted_models: null  # List of restricted models
  rpm_limit: null  # Requests Per Minute limit
  soft_limit_pct: null  # Fraction of monthly_budget at which to emit a soft-limit warning (e.g. 0.8 = ...
  tpm_limit: null  # Tokens Per Minute limit

# ── AI Guard (lexigram-ai-guard) ───────────────────────────────────────────────
# env_prefix: LEX_AI_GUARD__
ai_guard:
  enable_llm_guards: false  # —
  enabled: true  # —
  guard_model: "gpt-4o-mini"  # —
  injection_action: "block"  # —
  injection_detection: true  # —
  length_action: "block"  # —
  llm_guard_fail_open: false  # —
  llm_guard_threshold: 0.7  # —
  max_input_chars: 0  # —
  max_output_chars: 0  # —
  parallel_execution: false  # —
  pii_action: "redact"  # —
  pii_detection: true  # —
  pii_entities: null  # —
  pii_redaction_output: true  # —
  restricted_topics: null  # —
  sensitivity_level: "medium"  # —

# ── AI LLM (lexigram-ai-llm) ───────────────────────────────────────────────────
# env_prefix: LEX_AI_LLM__
ai_llm:
  api_base: null  # Custom API base URL (for Azure, local, or proxied endpoints).
  api_key: "${LEX_AI_LLM__API_KEY}"  # API key for the chosen provider.
  cache_ttl: 3600  # Cache TTL in seconds.
  enable_cache: false  # Enable response caching (requires CacheBackendProtocol in container).
  enabled: true  # Enable the LLM subsystem
  extra: null  # Provider-specific extra parameters passed verbatim.
  max_tokens: null  # Maximum tokens in response.
  model: "gpt-4-turbo"  # Model name or identifier.
  pin_policy: "ModelPinPolicy.LATEST"  # Policy for enforcing the model revision pin.
  pricing:
    cache_ttl: 86400  # Pricing cache TTL in seconds (default: 24 hours).
    enable_fuzzy_match: true  # Allow substring matching of model names to prices.
    enabled: true  # Register pricing manager and cost estimator.
    sources: null  # Pricing sources in priority order.
  provider: "ModelProvider.OPENAI"  # LLM provider name.
  temperature: 0.7  # Sampling temperature.
  thinking:
    budget_tokens: 10000  # —
    effort: null  # —
    level: null  # —
    suppress: false  # —
  timeout: 60.0  # Request timeout in seconds.

# ── AI MCP (lexigram-ai-mcp) ───────────────────────────────────────────────────
# env_prefix: LEX_AI_MCP__
ai_mcp:
  allow_unauthenticated: false  # —
  client_stdio_command: null  # —
  client_url: null  # —
  cors_origins: null  # —
  enable_sse: true  # —
  enabled: true  # Enable the MCP server subsystem
  host: "0.0.0.0"  # —
  max_request_size: "1024 * 1024"  # —
  path: "/mcp"  # —
  port: 8080  # —
  request_timeout: 30.0  # —
  server_name: "lexigram-mcp"  # —
  server_version: "1.0.0"  # —
  stdio_mode: false  # —

# ── AI Memory (lexigram-ai-memory) ─────────────────────────────────────────────
# env_prefix: LEX_AI_MEMORY__
ai_memory:
  consolidation:
    age_threshold_hours: null  # Minimum entry age (hours) before it can be consolidated
    batch_size: null  # Maximum entries processed per consolidation pass
    enabled: true  # Whether automatic background consolidation is active
    importance_prune_threshold: null  # Entries below this importance score are eligible for pruning
    interval_seconds: null  # How often to run a consolidation pass (seconds)
  default_backend: null  # Backend type to use ('in_memory', 'cache', 'database', 'vector')
  enabled: true  # Enable the AI memory subsystem
  episodic:
    default_top_k: null  # Default number of episodes to retrieve
    importance_weight: null  # Weight applied to entry importance during scoring
    recency_weight: null  # Weight applied to temporal recency during scoring
    relevance_weight: null  # Weight applied to semantic similarity during scoring
    ttl_seconds: null  # Time-to-live for entries in seconds (0 = never expire)
  semantic:
    max_facts_per_entity: null  # Hard cap on stored facts per entity
    min_confidence: null  # Minimum confidence score required to store a fact
  ttl_seconds: null  # Default entry TTL in seconds (0 = never expire)
  working:
    episodic_fraction: null  # Fraction of remaining budget for episodic recall
    max_recent_turns: null  # Hard cap on recent turns regardless of budget
    recent_turns_fraction: null  # Fraction of remaining budget for recent turns
    semantic_fraction: null  # Fraction of remaining budget for semantic facts
    system_prompt_tokens: null  # Fixed token allocation for system prompt
    tool_descriptions_fraction: null  # Fraction of remaining budget for tool descriptions

# ── AI Observability (lexigram-ai-observability) ───────────────────────────────
# env_prefix: LEX_AI_OBSERVABILITY__
ai_observability:
  enabled: true  # Master on/off switch for all observability
  health_checks_enabled: true  # Enable background health checking for AI components
  metrics_enabled: true  # Enable metrics collection
  trace_max_attribute_length: 0  # Cap on string attribute values written to trace spans, in characters. 0 disab...
  trace_redaction_enabled: false  # Redact secret-shaped keys (e.g. token, password, api_key) from trace span att...
  tracing_enabled: true  # Enable distributed tracing

# ── AI Prompt (lexigram-ai-prompt) ─────────────────────────────────────────────
# env_prefix: LEX_AI_PROMPT__
ai_prompt:
  default_format: "DEFAULT_RENDER_FORMAT"  # —
  enabled: true  # Enable the AI prompt subsystem
  max_variable_length: 0  # —
  sanitize_inputs: true  # —
  strict_sanitizer: true  # —

# ── AI RAG (lexigram-ai-rag) ───────────────────────────────────────────────────
# env_prefix: LEX_AI_RAG__
ai_rag:
  cache_ttl: 3600  # Cache TTL in seconds (default: 1 hour)
  chunk_overlap: 50  # Overlap between consecutive chunks
  chunk_size: 512  # Text chunk size in tokens
  chunking_strategy: "recursive"  # Chunking strategy (recursive, semantic, token)
  citation_style: "inline"  # Citation style (inline, footnote, numbered)
  collection_name: "default"  # Collection/index name for vector store
  embedding_model: null  # Embedding model identifier. Must be set explicitly — no vendor-specific default.
  embedding_provider: "openai"  # Embedding provider (openai, cohere, etc.)
  enable_caching: true  # Enable caching for RAG queries
  enable_citations: true  # Include source citations in responses
  enable_hallucination_detection: true  # Enable hallucination detection for AI responses
  enable_hyde: false  # Enable HyDE (Hypothetical Document Embeddings)
  enable_query_expansion: true  # Enable query expansion techniques
  enabled: true  # Enable the RAG pipeline
  min_citation_confidence: 0.6  # Minimum confidence for citation inclusion
  persist_directory: null  # Local directory path for vector store persistence (e.g. Chroma)
  similarity_threshold: 0.7  # Minimum similarity score threshold
  synthesis_strategy: "hybrid"  # Synthesis strategy (direct, extractive, abstractive, hybrid)
  tenancy:
    enabled: false  # Enable tenant-aware collection resolution in RAG pipeline
  top_k: 5  # Number of documents to retrieve
  use_hybrid_search: true  # Enable hybrid search (semantic + keyword)
  vector_dimension: 1536  # Embedding vector dimension (1536 for OpenAI ada-002)
  vector_store_type: "pgvector"  # Vector store backend (pgvector, chroma, qdrant, mock)

# ── AI Session (lexigram-ai-session) ───────────────────────────────────────────
# env_prefix: LEX_AI_SESSION__
ai_session:
  auto_checkpoint_interval: null  # Checkpoint every N turns; None to disable
  backend: null  # Persistence backend (in_memory, cache, database)
  cleanup_interval_s: null  # How often the cleanup scheduler sweeps for expired sessions
  consolidate_on_close: null  # Whether to trigger memory consolidation on session close
  cookie_name: null  # Cookie name for web session ID; None disables cookies
  default_system_prompt: null  # System prompt injected into every new session
  default_turn_strategy: null  # Default turn-selection strategy (round_robin, priority, llm_directed)
  enabled: true  # Enable the AI session subsystem
  header_name: null  # HTTP header name for session ID pass-through
  max_agents_per_group: null  # Maximum agents in a multi-agent group session
  max_branches_per_session: null  # Maximum forked branches per session
  max_checkpoints_per_session: null  # Maximum retained checkpoints per session
  max_sessions_per_user: null  # Maximum concurrent sessions per user
  max_turns_per_session: null  # Hard cap on turns before the session is closed
  name: "ai-session"  # Logical name used for DI registration keys
  session_ttl: null  # Maximum age of a session in seconds (0 to disable)

# ── AI Skills (lexigram-ai-skills) ─────────────────────────────────────────────
# env_prefix: LEX_AI_SKILLS__
ai_skills:
  allowed_script_types: null  # Allowed script types (py, sh, js)
  auto_discover: null  # Whether to auto-scan packages for skills on boot
  builtin_skills: null  # Names of built-in skills to register
  cache_backend: null  # Which cache backend to use (in_memory, cache)
  cache_enabled: null  # Whether result caching is globally enabled
  cache_ttl_seconds: null  # Default TTL for cached skill results (seconds)
  default_timeout_seconds: null  # Default execution timeout per skill (seconds)
  enable_builtin: null  # Whether built-in skills are registered on boot
  enable_skill_sources: true  # Whether to scan for external skill sources on boot
  enabled_directories: null  # Which skill directories to enable (claude_code, opencode, cursor, etc.)
  enforce_permissions: null  # Whether permission checks are enforced
  lazy_load_context: null  # Whether to lazily load skill context files
  max_concurrent_executions: null  # Semaphore cap on concurrent skill executions
  max_retries: null  # Default maximum retry attempts for skill execution
  name: "ai-skills"  # Logical name used for DI registration keys
  scan_packages: null  # Fully-qualified package names to scan for skills
  script_timeout_seconds: null  # Timeout for skill script execution (seconds)
  skill_paths: null  # Paths to scan for skills (SKILL.md folders)

# ── AI Workers (lexigram-ai-workers) ───────────────────────────────────────────
# env_prefix: LEX_AI_WORKERS__
ai_workers:
  batch_embedding_concurrency: 3  # Concurrency level for batch embedding execution
  dlq_check_interval: 60  # Interval in seconds for DLQ recovery sweeps
  document_ingestion_concurrency: 3  # Concurrency level for document parsing and chunking
  enable_maintenance: true  # Enable vector store and cache maintenance tasks
  enabled: true  # Master on/off switch for all background workers

# ── Audit (lexigram-audit) ─────────────────────────────────────────────────────
# env_prefix: LEX_AUDIT__
audit:
  enable_admin: null  # Whether to register the AuditAdminContributor
  hmac_key: "${LEX_AUDIT__HMAC_KEY}"  # HMAC key for checksum computation
  retention_policy: null  # Retention rules
  store_backend: null  # Backend type — 'sql' or 'memory'
  table_name: null  # SQL table name for the unified audit store
  verification_batch_size: null  # Entries to verify per verification run
  verification_schedule: null  # Cron expression for scheduled verification

# ── Auth (lexigram-auth) ───────────────────────────────────────────────────────
# env_prefix: LEX_AUTH__
auth:
  admin_email: null  # Initial admin email
  admin_password: "${LEX_AUTH__ADMIN_PASSWORD}"  # Initial admin password
  enabled: true  # —
  login_rate_limit: "5/minute"  # Default rate limit
  max_sessions_per_user: null  # Maximum number of concurrent sessions allowed per user. ``None`` (the default...
  middleware:
    backend: "session"  # Auth backend type
    exclude_paths: null  # Paths excluded from auth
    exclude_prefixes: null  # Path prefixes excluded
    header_name: "Authorization"  # Header name for token
    login_rate_limit: "5/minute"  # Rate limit for auth endpoints
    login_url: null  # URL to redirect for login
