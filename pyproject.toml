lexigram-ai-workers = { workspace = true }
lexigram-ai-observability = { workspace = true }
lexigram-ai-feedback = { workspace = true }
lexigram-vector = { workspace = true }
lexigram-graph = { workspace = true }
lexigram-web = { workspace = true }
lexigram-sql = { workspace = true }
lexigram-cache = { workspace = true }
lexigram-auth = { workspace = true }
lexigram-events = { workspace = true }
lexigram-queue = { workspace = true }
lexigram-tasks = { workspace = true }
