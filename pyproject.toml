# Curated PUBLIC workspace root for the open-source mirror.
# Hand-maintained (NOT a prune of the private root) so no private-root paths
# leak via tool config. Keep in sync with tools/publish_public.sh STABLE_PKGS.
[project]
name = "lexigram-workspace"
version = "0.1.2"
description = "Lexigram Framework Workspace (open source)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "lexigram",
    "lexigram-contracts",
    "lexigram-secrets",
    "lexigram-ai",
    "lexigram-ai-llm",
    "lexigram-ai-rag",
    "lexigram-ai-agents",
    "lexigram-ai-memory",
    "lexigram-ai-skills",
    "lexigram-ai-session",
    "lexigram-ai-mcp",
    "lexigram-ai-workers",
    "lexigram-ai-observability",
    "lexigram-ai-feedback",
    "lexigram-vector",
    "lexigram-graph",
    "lexigram-web",
    "lexigram-sql",
    "lexigram-cache",
    "lexigram-auth",
    "lexigram-events",
    "lexigram-queue",
    "lexigram-tasks",
    "lexigram-http",
    "lexigram-resilience",
    "lexigram-storage",
    "lexigram-search",
    "lexigram-notification",
    "lexigram-monitor",
    "lexigram-webhook",
    "lexigram-tenancy",
    "lexigram-features",
    "lexigram-audit",
    "lexigram-graphql",
    "lexigram-nosql",
    "lexigram-workflow",
    "lexigram-testing",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "redis>=7.1.1",
    "pymemcache>=4.0.0",
    "python-dotenv>=1.2.1",
    "nh3>=0.3.4",
]

[tool.uv.workspace]
members = [
    "lexigram",
    "lexigram-contracts",
    "lexigram-secrets",
    "lexigram-ai",
    "lexigram-ai-llm",
    "lexigram-ai-rag",
    "lexigram-ai-agents",
    "lexigram-ai-memory",
    "lexigram-ai-skills",
    "lexigram-ai-session",
    "lexigram-ai-mcp",
    "lexigram-ai-workers",
    "lexigram-ai-observability",
    "lexigram-ai-feedback",
    "lexigram-vector",
    "lexigram-graph",
    "lexigram-web",
    "lexigram-sql",
    "lexigram-cache",
    "lexigram-auth",
    "lexigram-events",
    "lexigram-queue",
    "lexigram-tasks",
    "lexigram-http",
    "lexigram-resilience",
    "lexigram-storage",
    "lexigram-search",
    "lexigram-notification",
    "lexigram-monitor",
    "lexigram-webhook",
    "lexigram-tenancy",
    "lexigram-features",
    "lexigram-audit",
    "lexigram-graphql",
    "lexigram-nosql",
    "lexigram-workflow",
    "lexigram-testing",
]

[tool.uv.sources]
lexigram = { workspace = true }
lexigram-contracts = { workspace = true }
lexigram-secrets = { workspace = true }
lexigram-ai = { workspace = true }
lexigram-ai-llm = { workspace = true }
