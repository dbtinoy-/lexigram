lexigram-graphql = { workspace = true }
lexigram-nosql = { workspace = true }
lexigram-workflow = { workspace = true }
lexigram-testing = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
# Glob avoids enumerating package paths; only present (open) packages match.
testpaths = ["lexigram*/tests"]
asyncio_mode = "auto"

# NOTE: detailed [tool.ruff.lint], [tool.mypy], and [tool.coverage] config from the
# private root were intentionally omitted here because they enumerate package
# paths. Port them with globbed paths if/when needed.
