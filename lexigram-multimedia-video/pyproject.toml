[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexigram-multimedia-video"
version = "0.1.3007"
description = "Video generation for the Lexigram Framework — local and API-based backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lexigram", "multimedia", "video", "ai", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
maintainers = [{ name = "Lexigram Framework Team", email = "team@lexigram.dev" }]
dependencies = [
    "lexigram-contracts>=0.1.0",
    "lexigram>=0.1.1",
    "aiohttp>=3.9.0",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://lexigram.dev"
Repository = "https://github.com/dbtinoy-/lexigram-multimedia-experimental"
Issues = "https://github.com/dbtinoy-/lexigram-multimedia-experimental/issues"
Changelog = "https://github.com/dbtinoy-/lexigram/blob/main/CHANGELOG.md"

[project.optional-dependencies]
runway = []
openai = []
cogvideox-server = ["torch", "diffusers", "transformers"]
svd-server = ["torch", "diffusers"]
test = [
    "lexigram-testing>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]

[dependency-groups]
dev = ["ruff>=0.8.0", "mypy>=1.0.0"]
test = [
    "lexigram-testing>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
lexigram-video-cogvideox-serve = "lexigram.multimedia.video.servers.cogvideox_server:main"
lexigram-video-svd-serve = "lexigram.multimedia.video.servers.svd_server:main"

[project.entry-points."lexigram.multimedia.subsystems"]
video = "lexigram.multimedia.video.di.provider:VideoGenerationProvider"

[project.entry-points."lexigram.multimedia.modules"]
video = "lexigram.multimedia.video.module:VideoModule"

[tool.hatch.build.targets.wheel]
packages = ["src/lexigram"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = [
        "structlog.*",
        "asyncpg.*",
        "aioredis.*",
        "aiomysql.*",
        "qdrant_client.*",
        "chromadb.*",
        "anthropic.*",
        "openai.*",
        "cohere.*",
        "groq.*",
        "mistralai.*",
        "ollama.*",
        "pinecone.*",
        "meilisearch.*",
        "boto3.*",
        "botocore.*",
        "google.cloud.*",
        "authlib.*",
        "strawberry.*",
        "mkdocs.*",
        "aiohttp.*",
        "aiofiles.*",
        "alembic.*",
        "sqlalchemy.*",
        "pydantic.*",
        "pydantic_settings.*",
        "redis.*",
        "celery.*",
        "kafka.*",
        "aiokafka.*",
        "aio_pika.*",
        "uvicorn.*",
        "starlette.*",
        "httpx.*",
        "tenacity.*",
        "cachetools.*",
        "importlib_metadata.*",
        "pkg_resources.*",
        "cryptography.*",
        "jwt.*",
        "passlib.*",
        "bcrypt.*",
        "yaml.*",
        "toml.*",
        "dotenv.*",
        "orjson.*",
        "msgpack.*",
    ], ignore_missing_imports = true },
]


[tool.ruff]
extend = "../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["PYI063"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lexigram"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_postgres: marks tests that require a live PostgreSQL connection",
]
addopts = [
    "--cov=lexigram.multimedia.video",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=40",
]
