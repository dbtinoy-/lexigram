# Copy to application.yaml and adjust to your deployment. Remove sections you don't use.
# Full field reference: see the README Configuration section.
# YAML key: multimedia: → music:
# Environment variable prefix: LEX_MULTIMEDIA_MUSIC__
#
# NOTE: lexigram-multimedia-music is a subsystem of the lexigram-multimedia
# umbrella. In application.yaml its config is nested under the `multimedia:`
# key. For standalone use, pass a MusicConfig directly to
# AudioMusicModule.configure(MusicConfig(...)).
#
# IMPORTANT: Never commit API keys. Store them in the secrets backend and
# reference them by name.

multimedia:
  music:
    # Music generation backend to use.
    backend: "local-http"  # local-http, stability-audio, ace-step, stable-audio-open

    # Local reference server (backend: local-http)
    local_http_base_url: "http://localhost:5003"

    # ACE-Step reference server (backend: ace-step)
    ace_step_base_url: "http://localhost:5300"

    # Stable Audio Open reference server (backend: stable-audio-open)
    stable_audio_open_base_url: "http://localhost:5301"

    # Request timeout in seconds.
    timeout: 60.0
