# Copy to application.yaml and adjust to your deployment. Remove sections you don't use.
# Full field reference: see the README Configuration section.

auth:
  # JWT Token Configuration
  jwt:
    secret_key: "${JWT_SECRET_KEY}"  # Generate: openssl rand -hex 32
    algorithm: "HS256"  # HS256, HS512, RS256, ES256
    access_token_expire: "30m"  # Duration: 30m, 1h, 24h
    refresh_token_expire: "7d"  # Duration: 7d, 14d
    id_token_expire: "1h"  # Duration
    key_rotation_grace_period: "1h"  # Duration
    
  # Password Security Policy
  password:
    min_length: 12
    max_length: 256
    require_uppercase: true
    require_lowercase: true
    require_digits: true
    require_special_chars: true
    special_chars: "!@#$%^&*()_+-=[]{}|;:,.<>?"
    expiration_days: 90  # 0 = never expires
    history_limit: 5  # Prevent reusing old passwords
    
  # Role-Based Access Control (RBAC)
  rbac:
    enabled: true
    superuser_bypass: true
    default_role: "viewer"
    cache_permissions: true
    permission_cache_ttl: 300
    
    # Built-in roles
    roles:
      - name: "admin"
        description: "Full system access"
        permissions:
          - "system:*"
      - name: "editor"
        description: "Can create and edit content"
        permissions:
          - "content:create"
          - "content:edit"
          - "content:delete_own"
      - name: "viewer"
        description: "Read-only access"
        permissions:
          - "content:read"
          
  # OAuth2 / Social Login
  oauth2:
    enabled: true
    
    google:
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
      redirect_uri: "http://localhost:8000/auth/google/callback"
      
    github:
      client_id: "${GITHUB_CLIENT_ID}"
      client_secret: "${GITHUB_CLIENT_SECRET}"
      redirect_uri: "http://localhost:8000/auth/github/callback"
      
    microsoft:
      client_id: "${MICROSOFT_CLIENT_ID}"
      client_secret: "${MICROSOFT_CLIENT_SECRET}"
      redirect_uri: "http://localhost:8000/auth/microsoft/callback"
      
  # LDAP / Active Directory
  ldap:
    enabled: false
    server_uri: "ldap://ldap.example.com:389"
    use_ssl: false
    use_tls: true
    bind_dn: "cn=admin,dc=example,dc=com"
    bind_password: "${LDAP_BIND_PASSWORD}"
    base_dn: "dc=example,dc=com"
    user_filter: "(uid={username})"
    group_filter: "(memberUid={uid})"
    
  # Session Management
  session:
    idle_timeout: "30m"  # Duration: 30m, 1h
    absolute_timeout: "8h"  # Duration: 8h, 24h
    sliding_window: true
    same_site: "Lax"  # Lax, Strict, None
    
  # Multi-Factor Authentication (MFA)
  mfa:
    enabled: false
    required_for_roles:
      - "admin"
    methods:
      - "totp"  # Time-based One-Time Password
      - "email"
      - "sms"
      
  # Account Lockout Policy
  lockout:
    enabled: true
    max_failed_attempts: 5
    window: "5m"  # Duration: 5m, 10m
    duration: "15m"  # Duration: 15m, 30m
    
  # Audit & Logging
  audit:
    enabled: true
    log_events:
      - "login"
      - "logout"
      - "password_change"
      - "mfa_enable"
      - "role_assignment"
