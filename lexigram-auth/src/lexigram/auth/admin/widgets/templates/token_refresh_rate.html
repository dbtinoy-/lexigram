{# Token Refresh Rate Widget Template #}
<div class="card">
  <div class="card-body">
    <h6 class="card-subtitle mb-3 text-muted">Refresh Rate (per minute)</h6>
    <h3 class="card-title">{{ "%.1f"|format(refreshes_per_minute) }}</h3>
    {% if total_refreshes > 0 %}
    <p class="small text-muted mb-0">Total refreshes: <strong>{{ total_refreshes }}</strong></p>
    {% endif %}
  </div>
</div>
