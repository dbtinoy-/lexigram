<div class="card h-100">
  <div class="card-body">
    <h6 class="card-title text-muted">Cache Backend</h6>
    {% if is_reachable %}
    <div class="text-success fw-bold">✓ {{ backend_name }}</div>
    {% else %}
    <div class="text-danger fw-bold">✗ Unreachable</div>
    {% endif %}
    <div class="text-muted small mt-2">Latency: {{ latency_ms }}ms</div>
  </div>
</div>
