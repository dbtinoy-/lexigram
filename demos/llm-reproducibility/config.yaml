# Seeded, config-driven LLM relay experiment.
# Same config + same seed => identical run_id and digest (reproducibility).
# Env override: LEXIGRAM_EXPERIMENT_SEED=<int> python run_experiment.py

experiment:
  name: llm-reproducibility
  description: Deterministic reproducibility probe over the Claude relay mapper
  seed: 42
  iterations: 5
  provider: anthropic

  # "claude-3-5-sonnet" exercises the standard wire path. List a
  # "claude-*-thinking" model to drive the thinking-adapter branch.
  model: claude-3-5-sonnet

  # Sampling knobs — seeded and deterministic by construction.
  temperature: 0.7
  top_p: 0.9
  max_tokens: 1024

  # Recording knobs (AITracer + AIMetrics from lexigram-ai-observability).
  tracing_enabled: true
  metrics_enabled: true