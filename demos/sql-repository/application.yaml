# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.
# ─────────────────────────────────────────────────────────────────────────────
web:
  server:
    host: 127.0.0.1
    port: 8000
  security:
    csrf:
      enabled: false


# ── Demo ────────────────────────────────────────────────────────────────────
# Demo-specific settings for the task management demo.  The
# TaskProvider reads this section automatically via config_key="task_app" /
# config_model=TaskAppConfig.
# ─────────────────────────────────────────────────────────────────────────────
task_app:
  project_name: "Task Manager"
