# ║                     SQL Repository Demo — Full Reference                 ║
# ║                                                                         ║
# ║  Teaches: lexigram-sql with SQLite, repository CRUD, unit-of-work,     ║
# ║           domain events, and the DI lifecycle.                          ║
# ║                                                                         ║
# ║  LEARNING PATH:                                                         ║
# ║    1. application.yaml   — you are here (configuration)                 ║
# ║    2. src/taskapp/app.py — composition root (wiring)                    ║
# ║    3. src/taskapp/di/provider.py — provider lifecycle                   ║
# ║    4. src/taskapp/repository/ — repository pattern                      ║
# ║    5. src/taskapp/services/ — business logic with Result[T, E]          ║
# ║    6. src/taskapp/controllers/api.py — HTTP surface                     ║
# ║    7. tests/ — real composition root, no mocks                          ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

