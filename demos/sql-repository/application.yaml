# ── Metadata ────────────────────────────────────────────────────────────────
name: sql-repository
version: 0.1.0
description: In-memory task management with CRUD API and SQL-like queries
# ────────────────────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
# SQL Repository Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: Lexigram DatabaseModule + one SQL-backed task repository.
#
# LEARNING PATH:
#   1. app.py:     DatabaseModule.configure(SQLite) + WebModule
#   2. provider:   DatabaseProviderProtocol and repository lifecycle
#   3. browser:    parameterized CRUD against the live SQLite table
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Demo config:        demos/sql-repository/src/taskapp/config.py
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 8000             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    # ── CSRF ───────────────────────────────────────────────────────────────
    # Disabled here because the demo posts JSON from the browser console.
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token
      # header_name: X-CSRF-Token
      # cookie_secure: true
      # cookie_httponly: true
      # cookie_samesite: Lax
      # token_length: 32
      # token_ttl: 3600
      # excluded_paths: []

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:
    #     - http://localhost:8000        # this demo
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   allow_credentials: false
    #   max_age: 600

    # ── Headers ─────────────────────────────────────────────────────────────
    # custom_headers:
    #   x-content-type-options: nosniff
    #   x-frame-options: DENY
    #   x-xss-protection: "1; mode=block"
    # referrer_policy: strict-origin-when-cross-origin

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # rate_limit:
  #   enabled: false
  #   default_limit: 100
  #   default_window: 60
  #   whitelist_ips: []
  #   storage_backend: memory

  # ── Misc ───────────────────────────────────────────────────────────────────
  # openapi_title: API
  # openapi_version: "1.0.0"
  # openapi_url: /openapi.json
  # swagger_ui_url: /docs
  # redoc_url: /redoc
  # compression_enabled: true
  # template_directory: templates
  # enable_auth: false
  # max_body_size: 10485760            # 10 MiB


# ── Demo settings ────────────────────────────────────────────────────────────
# DatabaseModule is configured explicitly in src/taskapp/app.py with an
# isolated SQLite URL. This section is only the demo-owned typed config.
# ─────────────────────────────────────────────────────────────────────────────
task_app:
  project_name: "SQL Task Repository"
