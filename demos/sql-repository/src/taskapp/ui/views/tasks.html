<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Task Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">SQL Repository</span>
  <div class="nav-links">
    <a href="https://lexigram.dev" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

  <header>
    <h1>Task Manager</h1>
    <p class="muted">SQL Repository — parameterized CRUD over Lexigram DatabaseModule and SQLite</p>
  </header>
  <main>
    <section id="task-panel">
      <h2>Tasks</h2>
      <form id="task-form">
        <label for="task-title">New task</label>
        <div class="input-row">
          <input id="task-title" type="text" placeholder="Try a repository insert" required>
          <button type="submit" id="create-task" class="accent">Create task</button>
        </div>
      </form>
      <p id="task-stats" class="muted" aria-live="polite"></p>
      <div id="tasks-list" aria-live="polite"></div>
    </section>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev" target="_blank" rel="noopener">Lexigram</a></div>
</body>
</html>
