<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Queue Worker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand"><img src="/static/logo.png" alt="" class="nav-logo"> Lexigram</a>
  <span class="nav-demo">Queue Worker</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>

  <header>
    <h1>Queue Worker</h1>
    <p class="muted">Queue Worker Demo — Demonstrates Lexigram queue pattern</p>
  </header>
  <main>
    <section id="enqueue-panel">
      <h2>Enqueue Job</h2>
      <div>
        <input id="job-payload" type="text" placeholder="Job payload..." style="width:60%;">
        <button id="btn-enqueue" class="accent">Enqueue</button>
      </div>
    </section>

    <section id="queue-panel">
      <h2>Queue Status</h2>
      <div id="queue-stats"></div>
    </section>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
</body>
</html>
