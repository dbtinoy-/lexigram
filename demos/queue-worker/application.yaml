# ── Web ──────────────────────────────────────────────────────────────────────
web:
  server:
    host: 127.0.0.1
    port: 8000
  security:
    csrf:
      enabled: false


# ── Demo ────────────────────────────────────────────────────────────────────
queueworker:
  queue_name: "tasks"
  max_retries: 3
  batch_size: 10
