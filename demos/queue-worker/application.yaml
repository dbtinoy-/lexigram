# ── Metadata ────────────────────────────────────────────────────────────────
name: queue-worker
version: 0.1.0
description: Message queue with publish/subscribe and background processing
# ────────────────────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
# Queue Worker Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: Queue pattern with in-memory backend, message consumers,
# and background task processing.  Demonstrates publish/consume patterns
# without requiring an external message broker.
#
# LEARNING PATH:
#   1. web:        HTTP server, security, CSRF
#   2. queueworker: Worker topic and message retry metadata
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Lexigram Queue:     packages/lexigram-queue/
#   - Demo config:        demos/queue-worker/src/queueworker/config.py
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 8000             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    # ── CSRF ───────────────────────────────────────────────────────────────
    # Disabled here because the demo posts JSON from the browser console.
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token
      # header_name: X-CSRF-Token
      # cookie_secure: true
      # cookie_httponly: true
      # cookie_samesite: Lax
      # token_length: 32
      # token_ttl: 3600
      # excluded_paths: []

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:
    #     - http://localhost:8000        # this demo
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   allow_credentials: false
    #   max_age: 600

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # rate_limit:
  #   enabled: false
  #   default_limit: 100
  #   default_window: 60
  #   whitelist_ips: []
  #   storage_backend: memory


# ── Queue Worker ─────────────────────────────────────────────────────────────
# Demo-specific settings for the queue worker demo.  The
# QueueWorkerProvider reads this section automatically via
# config_key="queueworker" / config_model=QueueWorkerConfig.
#
# QueueModule.stub() supplies Lexigram's in-memory QueueProtocol backend.
# The custom provider subscribes one MessageConsumer to this topic. Swap the
# module configuration for a broker-backed QueueConfig in a production app.
# ─────────────────────────────────────────────────────────────────────────────
queueworker:
  queue_name: "tasks"                  # the one topic this worker consumes
  max_retries: 3                       # BusMessage retry metadata
