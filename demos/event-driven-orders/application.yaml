# ── Metadata ────────────────────────────────────────────────────────────────
name: event-driven-orders
version: 0.1.0
description: Order lifecycle with domain events, outbox pattern, and CQRS
# ────────────────────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
# Event-Driven Orders Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: CQRS with event-driven read side — writes enter the CommandBus
# (place/pay/ship), command handlers persist through the repository and append
# to an outbox, and the EventBus fans domain events out to projections and
# notifications.  Everything runs on in-memory buses.
#
# LEARNING PATH:
#   1. web:        HTTP server, security, CSRF
#   2. events:     Command bus, event bus, domain events, outbox pattern
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Lexigram Events:    packages/lexigram-events/src/lexigram/events/config.py
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 7074             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    # enabled: true                    # master switch for security subsystem

    # ── CSRF ───────────────────────────────────────────────────────────────
    # Disabled here because the demo posts JSON from the browser console.
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token
      # header_name: X-CSRF-Token
      # cookie_secure: true
      # cookie_httponly: true
      # cookie_samesite: Lax
      # token_length: 32
      # token_ttl: 3600
      # excluded_paths: []

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:
    #     - http://localhost:7074        # this demo
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   allow_credentials: false
    #   max_age: 600

    # ── Headers ─────────────────────────────────────────────────────────────
    # custom_headers:
    #   x-content-type-options: nosniff
    #   x-frame-options: DENY
    #   x-xss-protection: "1; mode=block"
    # referrer_policy: strict-origin-when-cross-origin

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # rate_limit:
  #   enabled: false
  #   default_limit: 100
  #   default_window: 60
  #   whitelist_ips: []
  #   storage_backend: memory

  # ── Misc ───────────────────────────────────────────────────────────────────
  # openapi_title: API
  # openapi_version: "1.0.0"
  # openapi_url: /openapi.json
  # swagger_ui_url: /docs
  # redoc_url: /redoc
  # compression_enabled: true
  # template_directory: templates
  # enable_auth: false
  # max_body_size: 10485760            # 10 MiB


# ── Events (CQRS) ───────────────────────────────────────────────────────────
# Lexigram Events provides command bus, event bus, and domain event
# infrastructure.  The EventsModule reads this section automatically
# via config_key="events" / config_model=EventsConfig.
#
# This demo uses the default in-memory backends for everything — no
# database, broker, or external service required.
# ─────────────────────────────────────────────────────────────────────────────
# events:
#   enabled: true                      # master switch
#   event_store_backend: memory        # memory | postgres | mongodb | sqlite
#   debug: false
#
#   command_bus:
#     enabled: true
#     middleware:
#       logging: true                   # log every command dispatch
#       validation: true                # validate command dataclass fields
#       retry:
#         enabled: false
#         max_retries: 3
#         backoff_ms: 100
#
#   event_bus:
#     enabled: true
#     middleware:
#       logging: true
#       retry:
#         enabled: false
#         max_retries: 3
#         backoff_ms: 100
#
#   query_bus:
#     enabled: true
#
#   snapshots:
#     enabled: false
#     interval: 50                      # snapshot every N events
#
#   saga:
#     enabled: false
#
#   projection:
#     enabled: false
#
#   streaming:
#     enabled: false
