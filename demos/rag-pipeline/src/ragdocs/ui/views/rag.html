<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>RAG Pipeline</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">RAG Pipeline</span>
  <div class="nav-links">
    <a href="https://lexigram.dev" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

  <header>
    <h1>RAG Pipeline</h1>
    <p class="muted">RAG Pipeline Demo — Demonstrates Lexigram RAG pipeline pattern</p>
  </header>
  <main>
    <section id="query-panel">
      <h2>Query Documents</h2>
      <form id="query-form">
        <label for="query-input">Question</label>
        <div class="input-row">
          <input id="query-input" type="text" placeholder="Ask a question..." required>
          <button type="submit" id="btn-query" class="accent">Search</button>
        </div>
      </form>
      <div id="results" aria-live="polite"></div>
    </section>

    <section id="ingest-panel">
      <h2>Ingest Document</h2>
      <form id="ingest-form">
        <label for="doc-input">Document text</label>
        <textarea id="doc-input" rows="3" placeholder="Paste document text to ingest..." required></textarea>
        <button type="submit" id="btn-ingest">Ingest</button>
      </form>
    </section>

    <p id="error" class="error hidden" role="alert"></p>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev" target="_blank" rel="noopener">Lexigram</a></div>
</body>
</html>
