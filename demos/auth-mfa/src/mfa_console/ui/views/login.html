<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <title>Log in — mfa-console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="login">
<nav class="demo-nav">
  <a href="/" class="nav-brand"><img src="/static/logo.png" alt="" class="nav-logo"> Lexigram</a>
  <span class="nav-demo">Auth MFA</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>

  <div class="logo-header"><img src="/static/logo.png" alt="Lexigram"><h1 class="accent">Log in</h1></div>
  <div class="card">
    <p id="error" class="error"></p>
    <form id="login-form">
      <input name="email" type="email" placeholder="email" required />
      <input name="password" type="password" placeholder="password" required />
      <button type="submit">Log in</button>
    </form>
    <p class="muted">Seeded: mfa@mfa.demo / plain@mfa.demo — password <code>Demo-Password-1</code></p>
  </div>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      const form = new FormData(event.target);
      const result = await api("/api/login", {
        method: "POST",
        body: JSON.stringify({
          email: form.get("email"),
          password: form.get("password"),
        }),
      });
      if (!result.ok) {
        showError(result.body.error || "Login failed");
        return;
      }
      window.location.href = result.body.mfa_required ? "/challenge" : "/profile";
    });
  </script>
</body>
</html>
