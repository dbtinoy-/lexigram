<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <title>Two-factor check — mfa-console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="challenge">
<nav class="demo-nav">
  <a href="/" class="nav-brand"><img src="/static/logo.png" alt="" class="nav-logo"> Lexigram</a>
  <span class="nav-demo">Auth MFA</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>
<div class="wrap">

    <div class="logo-header"><h1 class="accent">Two-factor verification</h1></div>
    <p class="auth-desc">Enter the 6-digit code from your authenticator app</p>
    <div class="card">
      <p id="error" class="error"></p>
      <p class="muted">Enter the 6-digit code from your authenticator (or a backup code).</p>
      <form id="challenge-form">
        <label for="code">Authentication code</label>
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" placeholder="123456" required />
        <button type="submit">Verify</button>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
  <script>
    document.getElementById("challenge-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      const form = new FormData(event.target);
      const result = await api("/api/mfa/challenge", {
        method: "POST",
        body: JSON.stringify({ code: form.get("code") }),
      });
      if (result.ok) {
        window.location.href = "/profile";
      } else {
        showError(result.body.error || "Verification failed");
        if ((result.body.error || "").includes("too many attempts")) {
          setTimeout(() => { window.location.href = "/login"; }, 1200);
        }
      }
    });
  </script>
</body>
</html>
