<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Two-factor check — mfa-console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="challenge">
  <div class="logo-header"><img src="/static/logo.png" alt="Lexigram"><h1 class="accent">Two-factor verification</h1></div>
  <div class="card">
    <p id="error" class="error"></p>
    <p class="muted">Enter the 6-digit code from your authenticator (or a backup code).</p>
    <form id="challenge-form">
      <input name="code" inputmode="numeric" pattern="[0-9]*" placeholder="123456" required />
      <button type="submit">Verify</button>
    </form>
  </div>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
  <script>
    document.getElementById("challenge-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      const form = new FormData(event.target);
      const result = await api("/api/mfa/challenge", {
        method: "POST",
        body: JSON.stringify({ code: form.get("code") }),
      });
      if (result.ok) {
        window.location.href = "/profile";
      } else {
        showError(result.body.error || "Verification failed");
        if ((result.body.error || "").includes("too many attempts")) {
          setTimeout(() => { window.location.href = "/login"; }, 1200);
        }
      }
    });
  </script>
</body>
</html>
