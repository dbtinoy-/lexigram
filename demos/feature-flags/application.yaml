# Release Control Lab — deterministic, offline feature flag playground
web:
  server:
    host: 0.0.0.0
    port: 8099
  security:
    csrf:
      enabled: false
features:
  enabled: true
  cache_ttl: 15
  default_enabled: false
  initial_flags:
    new_checkout:
      type: percentage
      enabled: true
      percentage: 50
      description: Gradual rollout for the new checkout experience
    search_experiment:
      type: variant
      enabled: true
      variants:
        control: 50
        ranked: 50
      default_variant: control
      description: Deterministic A/B search ranking experiment
    ai_assistant:
      type: user_attribute
      enabled: true
      user_attributes:
        plan: pro
      description: Available only to users on the pro plan
release_control:
  enabled: true
  default_actor: release-operator
