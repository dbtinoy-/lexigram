<!DOCTYPE html>
<html>
  <head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realtime Console</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">Realtime Monitor</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>

<header>
  <h1>Realtime Console</h1>
  <p class="muted">Live telemetry streaming dashboard</p>
</header>
<div class="wrap">
      <div class="topbar">
        <div class="conn">
          <div class="conn">
            <span class="dot" id="conn-dot"></span>
            <span id="conn-label">Connecting…</span>
          </div>
        </div>
        <span class="chip">subs: <b id="subs">—</b></span>
        <span class="chip">history: <b id="hist">—</b></span>
        <span class="chip">♥ <b id="beat">—</b></span>
      </div>

      <div class="toolbar">
        <input placeholder="Search events…" id="search" class="search" type="search" />
        <select id="filter-sev">
          <option value="all">All severities</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="critical">Critical</option>
        </select>
        <button id="pause">Pause</button>
        <button id="clear">Clear feed</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Severity</th>
            <th>Source</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="events">
          <tr id="empty"><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>

      <form class="publish" id="publish-form">
        <input placeholder="Event message…" id="msg" required />
        <input placeholder="source" value="console" id="src" />
        <select id="sev">
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="critical">critical</option>
        </select>
        <button type="submit" id="publish-btn">Publish</button>
      </form>

      <script src="/static/dashboard.js"></script>
      <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
    </div>
  </body>
</html>
