# ── Metadata ────────────────────────────────────────────────────────────────
name: support-agent
version: 0.1.0
description: Agent with tool orchestration and step-by-step trace
# ────────────────────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
# Support Agent Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: AI agents with scripted LLM — ReAct strategy, tool calls,
# scenario scripts, and byte-stable deterministic output.
#
# LEARNING PATH:
#   1. web:        HTTP server, security, CSRF
#   2. ai_agents:  Agent execution, strategy, iteration limits
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Lexigram Agents:    experimental/ai/lexigram-ai-agents/src/lexigram/ai/agents/config.py
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 8082             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    # enabled: true                    # master switch for security subsystem

    # ── CSRF ───────────────────────────────────────────────────────────────
    # Disabled here because the demo posts JSON from the browser console.
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token
      # header_name: X-CSRF-Token
      # cookie_secure: true
      # cookie_httponly: true
      # cookie_samesite: Lax
      # token_length: 32
      # token_ttl: 3600
      # excluded_paths: []

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:
    #     - http://localhost:8082        # this demo
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   allow_credentials: false
    #   max_age: 600

    # ── Headers ─────────────────────────────────────────────────────────────
    # custom_headers:
    #   x-content-type-options: nosniff
    #   x-frame-options: DENY
    #   x-xss-protection: "1; mode=block"
    # referrer_policy: strict-origin-when-cross-origin

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # rate_limit:
  #   enabled: false
  #   default_limit: 100
  #   default_window: 60
  #   whitelist_ips: []
  #   storage_backend: memory

  # ── Misc ───────────────────────────────────────────────────────────────────
  # openapi_title: API
  # openapi_version: "1.0.0"
  # openapi_url: /openapi.json
  # swagger_ui_url: /docs
  # redoc_url: /redoc
  # compression_enabled: true
  # template_directory: templates
  # enable_auth: false
  # max_body_size: 10485760            # 10 MiB


# ── AI Agents ───────────────────────────────────────────────────────────────
# Lexigram AI Agents provides agent execution, tool registry, and
# strategy support.  The AgentsModule reads this section automatically
# via config_key="ai_agents" / config_model=AgentConfig.
#
# NOTE: This demo overrides max_iterations=5 in app.py via
# AgentsModule.configure(AgentConfig(max_iterations=5)).  The yaml
# values below are defaults — the explicit override wins at boot.
# ─────────────────────────────────────────────────────────────────────────────
ai_agents:
  enabled: true                      # master switch for agent subsystem

  # ── Execution ──────────────────────────────────────────────────────────────
  max_iterations: 10                 # overridden to 5 in app.py
  # default_temperature: 0.7         # LLM temperature
  # default_max_tokens: 2048         # max tokens per LLM response
  # tool_max_retries: 3              # retries for transient tool errors

  # ── Observability ──────────────────────────────────────────────────────────
  # enable_tracing: true             # OpenTelemetry tracing
  # enable_metrics: true             # Prometheus metrics
