<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <title>Log in — apikeys-console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="login">
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">Auth API Keys</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>
<header>
  <h1>Log in</h1>
  <p class="muted">Sign in to manage your API keys</p>
</header>
<main class="auth-shell">
<div class="auth-content">

    <div class="card">
      <p id="error" class="error"></p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="password" required />
        <button type="submit">Log in</button>
      </form>
      <p class="muted">Seeded: admin@keys.demo / <code>Demo-Password-1</code></p>
    </div>
  </div>

<script src="/static/app.js"></script>
<div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
<script>
  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    showError("");
    const form = new FormData(event.target);
    const result = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({
        email: form.get("email"),
        password: form.get("password"),
      }),
    });
    if (result.ok) {
      window.location.href = "/keys";
    } else {
      showError(result.body.error || "Login failed");
    }
  });
</script>
</main>
</body>
</html>
