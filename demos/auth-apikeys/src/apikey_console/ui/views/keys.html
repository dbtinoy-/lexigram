<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <title>API keys — apikeys-console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="keys">
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">Auth API Keys</span>
  <div class="nav-links">
    <a href="https://lexigram.dev" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>
<header>
  <h1>API keys</h1>
  <p class="muted">Manage machine-to-machine credentials</p>
</header>
<main class="auth-shell">
<div class="auth-content">

    <p id="error" class="error" role="alert"></p>

    <div class="card raw-key-box" id="raw-key-box" style="display:none">
      <div class="card-header"><strong>Raw key — shown once, copy it now</strong></div>
      <code id="raw-key"></code>
    </div>

    <div class="card">
      <div class="card-header"><strong>Your keys</strong></div>
      <table>
        <thead><tr><th>Name</th><th>Prefix</th><th>Scopes</th><th>Expires</th><th></th></tr></thead>
        <tbody id="key-rows"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-header"><strong>Issue a new key</strong></div>
      <form id="create-form">
        <input name="name" placeholder="key name" required />
        <label><input type="checkbox" name="scope-read" checked /> read</label>
        <label><input type="checkbox" name="scope-write" /> write</label>
        <button type="submit">Create key</button>
      </form>
      <p class="muted">Machine usage:
        <code>curl -H "X-API-Key: &lt;raw&gt;" http://127.0.0.1:8084/api/me</code></p>
    </div>

    <nav class="auth-footer"><a href="#" id="logout">Log out</a></nav>
</div>
</main>

<script src="/static/app.js"></script>
<div class="demo-footer">Powered by <a href="https://lexigram.dev" target="_blank" rel="noopener">Lexigram</a></div>
<script src="/static/keys.js"></script>
</body>
</html>
