services:
  shorts-creator:
    build:
      context: .
      additional_contexts:
        - framework=../framework/lexigram
        - tools=../tools
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DSM_PORT:-18080}:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    runtime: nvidia
    environment:
      - DSM_PORT=8080
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - /tmp:/tmp
      - ./src:/app/project/shorts-creator/src
      - ./templates:/app/project/shorts-creator/templates
      - ./application.yaml:/app/project/shorts-creator/application.yaml
      - ./migrations:/app/project/shorts-creator/migrations
      - ./asgi_app.py:/app/project/shorts-creator/asgi_app.py
      - ./data:/app/project/shorts-creator/data
      - ./data/skills:/app/project/shorts-creator/data/skills
      - ../framework/lexigram:/app/framework/lexigram
      - ../tools:/app/project/tools
      - ../dsm/chatterbox-venv:/app/dsm/chatterbox-venv
      - /home/admin/.cache/huggingface/hub/models--ResembleAI--chatterbox:/root/.cache/huggingface/hub/models--ResembleAI--chatterbox


