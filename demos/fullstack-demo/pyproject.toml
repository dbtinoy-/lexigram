[project]
name = "shorts-creator"
version = "0.1.0"
description = "Short-form video creator (Lexigram + ffmpeg)"
requires-python = ">=3.11"
dependencies = [
    "lexigram",
    "lexigram-web",
    "lexigram-ui",
    "lexigram-contracts",
    "lexigram-multimedia",
    "lexigram-multimedia-video",
    "lexigram-multimedia-beat[librosa]",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pyyaml>=6.0.3",
    "lexigram-ai-llm",
    "aiohttp>=3.14.3",
    "lexigram-cli",
    "python-multipart>=0.0.32",
    "lexigram-sql",
    "lexigram-tasks",
    "lexigram-ai-agents",
    "aiosqlite>=0.20",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[project.optional-dependencies]
tts = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "chatterbox-tts>=0.1",
]

[tool.uv.sources]
lexigram = { path = "../../core/lexigram", editable = true }
lexigram-web = { path = "../../packages/lexigram-web", editable = true }
lexigram-ui = { path = "../../experimental/apps/lexigram-ui", editable = true }
lexigram-ai-llm = { path = "../../experimental/ai/lexigram-ai-llm", editable = true }
lexigram-cli = { path = "../../experimental/apps/lexigram-cli", editable = true }
lexigram-sql = { path = "../../packages/lexigram-sql", editable = true }
lexigram-tasks = { path = "../../packages/lexigram-tasks", editable = true }
lexigram-ai-agents = { path = "../../experimental/ai/lexigram-ai-agents", editable = true }
lexigram-contracts = { path = "../../core/lexigram-contracts", editable = true }
lexigram-multimedia = { path = "../../experimental/multimedia/lexigram-multimedia", editable = true }
lexigram-multimedia-video = { path = "../../experimental/multimedia/lexigram-multimedia-video", editable = true }
lexigram-multimedia-beat = { path = "../../experimental/multimedia/lexigram-multimedia-beat", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
[[tool.mypy.overrides]]
module = ["torch", "torchaudio", "chatterbox.tts"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Small JSON files; blocking IO in async helpers is deliberate here.
"src/shorts_creator/services/history_service.py" = ["ASYNC230"]
# Test fixtures run alembic synchronously before async tests.
"tests/*" = ["ASYNC221"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_creator"]
