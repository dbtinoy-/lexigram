# Resilient Rates — every runtime knob lives here (Blueprint §3).
# Profiles: application.<LEX_PROFILE>.yaml overlays on top of this file.
web:
  server:
    host: 127.0.0.1
    port: 7073
  security:
    csrf:
      enabled: false

# lexigram-cache (config_key: "cache") — backend owns TTL semantics
cache:
  backends:
    - name: default
      type: memory
      default: true
      default_ttl: 60

demo:
  upstream_scenario: healthy # healthy | flaky | down | slow
