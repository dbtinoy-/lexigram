<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Resilient Rates Desk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand"><img src="/static/logo.png" alt="" class="nav-logo"> Lexigram</a>
  <span class="nav-demo">Resilient Rates</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>

  <header>
    <h1>Resilient Rates Desk</h1>
    <p class="muted">Resilient pricing with circuit breakers and rate limits</p>
  </header>
  <main>
    <section id="controls">
      <h2>Upstream Health</h2>
      <div id="scenarios">
        <button data-scenario="healthy" class="active">Healthy</button>
        <button data-scenario="flaky">Flaky</button>
        <button data-scenario="down">Down</button>
        <button data-scenario="slow">Slow</button>
      </div>
      <button id="clear-cache" class="danger">Clear Cache</button>
    </section>

    <section id="actions">
      <h2>Actions</h2>
      <button id="btn-stampede">Stampede (10 concurrent)</button>
      <button id="btn-demo" class="accent">Run 5-Act Demo</button>
    </section>

    <section id="pairs">
      <h2>Currency Pairs</h2>
      <div id="pair-cards"></div>
    </section>

    <section id="stats-panel">
      <h2>Service Stats</h2>
      <div id="stats-grid">
        <div class="stat"><span class="stat-label">Hits</span><span id="s-hits" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Misses</span><span id="s-misses" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Upstream</span><span id="s-upstream" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Retries</span><span id="s-retries" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Stale</span><span id="s-stale" class="stat-value">0</span></div>
      </div>
    </section>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
</body>
</html>
