# ║  LEARNING PATH:                                                         ║
# ║    1. application.yaml   — you are here (configuration)                 ║
# ║    2. src/monitorstack/app.py — composition root (wiring)               ║
# ║    3. src/monitorstack/di/provider.py — provider lifecycle              ║
# ║    4. src/monitorstack/services/ — metrics and health patterns          ║
# ║    5. tests/ — real composition root, no mocks                          ║
