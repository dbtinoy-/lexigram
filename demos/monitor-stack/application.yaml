# ── Metadata ────────────────────────────────────────────────────────────────
name: monitor-stack
version: 0.1.0
description: Health checks, metrics collection, and distributed tracing
# ────────────────────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
# Monitor Stack Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: Lexigram MonitorModule health, metrics, and tracing.
# The package-owned in-memory instruments keep the console standalone.
#
# LEARNING PATH:
#   1. web:        HTTP server, security, CSRF
#   2. monitor:     Lexigram metric/tracing backend and span retention
#   3. monitorstack: Demo health-response label
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Lexigram Monitor:   packages/lexigram-monitor/
#   - Demo config:        demos/monitor-stack/src/monitorstack/config.py
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 8000             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    # ── CSRF ───────────────────────────────────────────────────────────────
    # Disabled here because the demo posts JSON from the browser console.
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token
      # header_name: X-CSRF-Token
      # cookie_secure: true
      # cookie_httponly: true
      # cookie_samesite: Lax
      # token_length: 32
      # token_ttl: 3600
      # excluded_paths: []

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:
    #     - http://localhost:8000        # this demo
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   allow_credentials: false
    #   max_age: 600

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # rate_limit:
  #   enabled: false
  #   default_limit: 100
  #   default_window: 60
  #   whitelist_ips: []
  #   storage_backend: memory


# ── Monitor Stack ────────────────────────────────────────────────────────────
# Demo-owned display label. MonitorModule reads its own observability section
# above; this provider config is deliberately not a second metrics system.
# ─────────────────────────────────────────────────────────────────────────────
# ── Lexigram Monitor capability ──────────────────────────────────────────────
# MonitorModule supplies the real metric instruments, bounded in-memory trace
# provider, and categorised health registry used by the console.
monitor:
  backend_type: memory
  tracing:
    enabled: true
    service_name: demo-service
    max_spans: 200

# ── Demo console settings ────────────────────────────────────────────────────
monitorstack:
  service_name: "monitor-console"
