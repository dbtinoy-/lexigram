# ── Web ──────────────────────────────────────────────────────────────────────
web:
  server:
    host: 127.0.0.1
    port: 8000
  security:
    csrf:
      enabled: false


# ── Demo ────────────────────────────────────────────────────────────────────
monitorstack:
  service_name: "demo-service"
  health_check_interval: 30
  metrics_enabled: true
