# ══════════════════════════════════════════════════════════════════════════════
# Monitor Stack Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: Monitoring pattern with in-memory backend, health checks,
# metrics collection, and request tracing.  Demonstrates observability
# patterns without requiring external monitoring services.
#
# LEARNING PATH:
#   1. web:        HTTP server, security, CSRF
#   2. monitorstack: Service name, health check interval, metrics toggle
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Lexigram Monitor:   packages/lexigram-monitor/
#   - Demo config:        demos/monitor-stack/src/monitorstack/config.py
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 8000             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    # ── CSRF ───────────────────────────────────────────────────────────────
    # Disabled here because the demo posts JSON from the browser console.
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token
      # header_name: X-CSRF-Token
      # cookie_secure: true
      # cookie_httponly: true
      # cookie_samesite: Lax
      # token_length: 32
      # token_ttl: 3600
      # excluded_paths: []

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:
    #     - http://localhost:8000        # this demo
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   allow_credentials: false
    #   max_age: 600

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # rate_limit:
  #   enabled: true
  #   default_limit: 100
  #   default_window: 60
  #   whitelist_ips: []
  #   storage_backend: memory


# ── Monitor Stack ────────────────────────────────────────────────────────────
# Demo-specific settings for the monitoring demo.  The
# MonitorStackProvider reads this section automatically via
# config_key="monitorstack" / config_model=MonitorStackConfig.
#
# This demo uses in-memory metrics to demonstrate health checks,
# counters, gauges, histograms, and request tracing without requiring
# external monitoring services like Prometheus or Datadog.
# ─────────────────────────────────────────────────────────────────────────────
monitorstack:
  service_name: "demo-service"         # service name for metrics tagging
  health_check_interval: 30            # seconds between health checks
  metrics_enabled: true                # enable metrics collection
  # tracing_enabled: true              # enable request tracing
  # log_level: "info"                  # log level for monitoring
  # export_interval: 60                # seconds between metric exports
