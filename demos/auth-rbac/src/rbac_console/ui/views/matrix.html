<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Permission matrix — rbac-console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="matrix">
  <div class="logo-header"><img src="/static/logo.png" alt="Lexigram"><h1 class="accent">Permission matrix</h1></div>
  <nav>
    <a href="#" id="logout">Log out</a>
    <span id="who" class="chip"></span>
  </nav>
  <div class="card">
    <div class="row"><strong>Live grid — computed via authorize()</strong></div>
    <p id="error" class="error"></p>
    <table>
      <thead><tr><th>required permission</th><th>viewer</th><th>editor</th><th>admin</th></tr></thead>
      <tbody id="grid"></tbody>
    </table>
    <p class="muted">admin bypasses every check (role-name bypass); editor inherits viewer.</p>
  </div>
  <div class="card">
    <div class="row"><strong>Try a verdict</strong></div>
    <form id="try-form">
      <select id="try-role">
        <option value="viewer">viewer</option>
        <option value="editor">editor</option>
        <option value="admin">admin</option>
      </select>
      <input id="try-action" placeholder="action (e.g. view)" required />
      <input id="try-resource" placeholder="resource (e.g. articles)" required />
      <button type="submit">authorize()</button>
    </form>
    <pre id="verdict" class="muted"></pre>
  </div>
  <div class="card">
    <div class="row"><strong>Articles</strong>
      <form id="create-form" style="display:flex;gap:0.5rem">
        <input id="new-title" placeholder="new title" required />
        <button type="submit">Create</button>
      </form>
    </div>
    <ul id="article-list"></ul>
  </div>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
  <script src="/static/matrix.js"></script>
</body>
</html>
