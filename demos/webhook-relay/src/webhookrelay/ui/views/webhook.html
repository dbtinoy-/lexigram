<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Webhook Relay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">Webhook Relay</span>
  <div class="nav-links">
    <a href="https://lexigram.dev" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

  <header>
    <h1>Webhook Relay</h1>
    <p class="muted">Create a Lexigram subscription, sign an event, and inspect the verified relay</p>
  </header>
  <main>
    <section id="subscription-panel">
      <h2>Lexigram Subscription</h2>
      <form id="subscription-form">
        <label for="subscription-url">Receiver URL</label>
        <input id="subscription-url" type="url" value="https://example.test/hooks" required>
        <label for="subscription-events">Event types <span class="muted">comma-separated</span></label>
        <input id="subscription-events" type="text" value="order.created, payment.received" required>
        <button type="submit" id="btn-subscribe" class="accent">Create subscription</button>
      </form>
      <p id="subscription-output" class="result" aria-live="polite">No browser subscription yet.</p>
      <div id="subscription-list" class="muted" aria-live="polite"></div>
    </section>

    <section id="send-panel">
      <h2>Send Inbound Event</h2>
      <form id="send-form">
        <label for="event-type">Event type</label>
        <div class="input-row">
          <select id="event-type">
            <option value="order.created">order.created</option>
            <option value="payment.received">payment.received</option>
          </select>
          <button type="submit" id="btn-send" class="accent">Send event</button>
        </div>
        <label class="checkbox-label">
          <input id="use-signature" type="checkbox" checked>
          Verify with the active subscription secret
        </label>
      </form>
      <p id="error" class="error hidden" role="alert"></p>
    </section>

    <section id="events-panel">
      <h2>Accepted Events</h2>
      <div id="events-list" aria-live="polite"></div>
    </section>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev" target="_blank" rel="noopener">Lexigram</a></div>
</body>
</html>
