<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Webhook Relay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">Webhook Relay</span>
  <div class="nav-links">
    <a href="https://lexigram.dev" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

  <header>
    <h1>Webhook Relay</h1>
    <p class="muted">Webhook Relay Demo — Demonstrates Lexigram webhook pattern</p>
  </header>
  <main>
    <section id="send-panel">
      <h2>Send Webhook</h2>
      <form id="send-form">
        <label for="event-type">Event type</label>
        <div class="input-row">
          <select id="event-type">
            <option value="order.created">order.created</option>
            <option value="payment.received">payment.received</option>
            <option value="user.registered">user.registered</option>
          </select>
          <button type="submit" id="btn-send" class="accent">Send</button>
        </div>
      </form>
      <p id="error" class="error hidden" role="alert"></p>
    </section>

    <section id="events-panel">
      <h2>Recent Events</h2>
      <div id="events-list" aria-live="polite"></div>
    </section>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev" target="_blank" rel="noopener">Lexigram</a></div>
</body>
</html>
