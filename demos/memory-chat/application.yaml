# ══════════════════════════════════════════════════════════════════════════════
# Memory Chat Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: Tiered memory — episodic recall, semantic facts,
# working-memory assembly, and owner isolation.  No LLM: a
# deterministic template responder proves the memory subsystem
# works standalone.
#
# LEARNING PATH:
#   1. web:        HTTP server, security, rate limiting
#   2. ai_memory:  Working/episodic/semantic memory tiers, consolidation
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Lexigram Memory:    experimental/ai/lexigram-ai-memory/src/lexigram/ai/memory/config.py
#
# ENVIRONMENT VARIABLE OVERRIDE:
#   Every key can be overridden via LEX_* env vars with __ as delimiter.
#   Examples:
#     LEX_WEB__SERVER__PORT=9000
#     LEX_AI_MEMORY__DEFAULT_BACKEND=cache
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
#
# The orchestrator calls get_section("web", WebConfig) and injects
# the result into WebProvider.config before register() runs.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  # Binds the uvicorn / gunicorn process.
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 8083             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  # HSTS, CSP, CORS, CSRF, and security headers — all aggregated here.
  security:
    # enabled: true                    # master switch for security subsystem

    # ── CSRF ───────────────────────────────────────────────────────────────
    # Protects against cross-site request forgery.  Disabled here because
    # the demo posts JSON from the browser console (no cookies).
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token         # CSRF cookie name
      # header_name: X-CSRF-Token       # client sends token in this header
      # cookie_secure: true             # HTTPS only
      # cookie_httponly: true            # no JS access
      # cookie_samesite: Lax            # SameSite policy
      # token_length: 32                # token bytes
      # token_ttl: 3600                 # synchronizer-mode TTL (seconds)
      # excluded_paths: []              # paths exempt from CSRF validation
      # exclude_content_types: []       # Content-Types that bypass CSRF
      # exclude_auth_schemes: []        # Auth schemes that bypass CSRF
      # secret_key: null                # HMAC key (LEX_WEB__SECURITY__CSRF__SECRET_KEY)

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:                # browser origins allowed to call API
    #     - http://localhost:3000       #   (dev frontend)
    #     - http://localhost:8083       #   (this demo)
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   expose_headers: []
    #   allow_credentials: false        # true requires explicit origins
    #   max_age: 600                    # preflight cache (seconds)

    # ── Hosts ──────────────────────────────────────────────────────────────
    # allowed_hosts: []                # hostnames permitted to reach app
                                      # empty = reject all in production

    # ── HSTS ───────────────────────────────────────────────────────────────
    # hsts:
    #   enabled: false                 # true in production
    #   max_age: 31536000              # 1 year
    #   include_subdomains: true
    #   preload: true

    # ── Headers ─────────────────────────────────────────────────────────────
    # custom_headers:
    #   x-content-type-options: nosniff
    #   x-frame-options: DENY
    #   x-xss-protection: "1; mode=block"
    # referrer_policy: strict-origin-when-cross-origin

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # Prevents brute-force and DoS attacks.  Longest-prefix-match selects
  # the rule for each request path.
  # rate_limit:
  #   enabled: true
  #   default_limit: 100               # max requests per window
  #   default_window: 60               # window size (seconds)
  #   whitelist_ips: []                # exempt IPs
  #   storage_backend: memory          # "memory" or "redis"
  #   rules:                           # per-path overrides
  #     /api/chat:
  #       requests: 30
  #       window: 60

  # ── Static Files ───────────────────────────────────────────────────────────
  # static:
  #   enabled: false                   # serve static files
  #   directory: static
  #   prefix: /static
  #   html: false                      # SPA mode

  # ── OpenAPI / Docs ─────────────────────────────────────────────────────────
  # openapi_title: API
  # openapi_version: "1.0.0"
  # openapi_url: /openapi.json
  # swagger_ui_url: /docs
  # redoc_url: /redoc

  # ── Misc ───────────────────────────────────────────────────────────────────
  # compression_enabled: true          # gzip / brotli
  # template_directory: templates      # Jinja2 templates
  # enable_identity_resolution: false  # resolve OAuth external IDs
  # enable_auth: false                 # built-in auth middleware
  # max_body_size: 10485760            # 10 MiB — protects against OOM DoS


# ── AI Memory ────────────────────────────────────────────────────────────────
# Lexigram AI Memory provides three-tier memory: working (token-budgeted
# context), episodic (past interactions), and semantic (facts/triples).
# The MemoryModule reads this section automatically via
# config_key="ai_memory" / config_model=MemoryConfig.
#
# NOTE: This demo passes MemoryConfig(default_backend="in_memory") explicitly
# in app.py, so the yaml values below are documentation-only.  The framework
# falls back to these defaults when no explicit config is provided.
#
# The orchestrator calls get_section("ai_memory", MemoryConfig) and injects
# the result into MemoryProvider.config before register() runs.
# ─────────────────────────────────────────────────────────────────────────────
# ai_memory:
  # enabled: true                      # master switch for memory subsystem

  # ── Backend ────────────────────────────────────────────────────────────────
  # Memory entries are stored in this backend.  "in_memory" is the default
  # for demos and tests — no external dependencies.
  # default_backend: in_memory         # "in_memory", "cache", "database", "vector"

  # ── TTL ────────────────────────────────────────────────────────────────────
  # Default time-to-live for memory entries (0 = never expire).
  # ttl_seconds: 0

  # ── Working Memory ─────────────────────────────────────────────────────────
  # Token-budgeted context assembled each turn.  Controls how the 256-token
  # budget is split across system prompt, recent turns, episodic recall,
  # semantic facts, and tool descriptions.
  # working:
  #   system_prompt_tokens: 50          # fixed allocation for system prompt
  #   recent_turns_fraction: 0.4        # fraction for recent conversation turns
  #   episodic_fraction: 0.3            # fraction for episodic recall results
  #   semantic_fraction: 0.2            # fraction for semantic fact triples
  #   tool_descriptions_fraction: 0.1   # fraction for tool descriptions
  #   max_recent_turns: 10              # hard cap regardless of budget

  # ── Episodic Memory ────────────────────────────────────────────────────────
  # Stores past interactions and retrieves them by relevance.
  # episodic:
  #   default_top_k: 5                  # default number of episodes to retrieve
  #   recency_weight: 0.3               # weight for temporal recency in scoring
  #   importance_weight: 0.3            # weight for entry importance
  #   relevance_weight: 0.4             # weight for semantic similarity
  #   ttl_seconds: 0                    # per-entry TTL (0 = never expire)

  # ── Semantic Memory ────────────────────────────────────────────────────────
  # Stores subject/predicate/object fact triples.
  # semantic:
  #   min_confidence: 0.5               # minimum confidence to store a fact
  #   max_facts_per_entity: 100         # hard cap per entity

  # ── Consolidation ──────────────────────────────────────────────────────────
  # Background pipeline that promotes episodic entries to semantic facts.
  # Disabled in this demo for deterministic teaching flows.
  # consolidation:
  #   enabled: false                    # disabled — demo is deterministic
  #   interval_seconds: 3600            # how often to run a consolidation pass
  #   age_threshold_hours: 24           # minimum entry age before promotion
  #   importance_prune_threshold: 0.2   # entries below this are pruned
  #   batch_size: 50                    # max entries per pass
