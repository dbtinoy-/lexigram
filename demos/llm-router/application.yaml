# ── Metadata ────────────────────────────────────────────────────────────────
name: llm-router
version: 0.1.0
description: Multi-provider LLM routing with style-based content generation
# ────────────────────────────────────────────────────────────────────────────
# ══════════════════════════════════════════════════════════════════════════════
# LLM Router Demo — Complete Configuration Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# Every configuration key available for this demo.
# Uncommented lines are the values we override; commented lines show
# defaults.  Each section maps 1:1 to a typed config model — the
# framework validates your yaml against it at boot time.
#
# DEMO FOCUS: LLM client pattern with ScriptedLLMClient for deterministic
# testing, content generation, and structured product extraction.
#
# LEARNING PATH:
#   1. web:        HTTP server, security, CSRF
#   2. content_gen: Content generation settings, writing style, retries
#
# For full reference see:
#   - Lexigram Web:       packages/lexigram-web/src/lexigram/web/config/
#   - Lexigram AI LLM:    experimental/ai/lexigram-ai-llm/
#   - Demo config:        demos/llm-router/src/content_gen/config.py
# ══════════════════════════════════════════════════════════════════════════════


# ── Web ──────────────────────────────────────────────────────────────────────
# Lexigram Web auto-configures Starlette, OpenAPI, CORS, CSRF, and
# rate limiting from this single section.  The WebModule reads it
# automatically via config_key="web" / config_model=WebConfig.
# ─────────────────────────────────────────────────────────────────────────────
web:
  # ── Server ─────────────────────────────────────────────────────────────────
  server:
    host: 127.0.0.1       # bind address (0.0.0.0 for external access)
    port: 8000             # listen port
    # workers: 1           # uvicorn workers (1 = single process)
    # reload: false        # auto-reload on file changes (dev only)
    # debug: false         # enable debug mode

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    # ── CSRF ───────────────────────────────────────────────────────────────
    # Disabled here because the demo posts JSON from the browser console.
    csrf:
      enabled: false                    # disable for JSON-only playground
      # cookie_name: csrf_token
      # header_name: X-CSRF-Token
      # cookie_secure: true
      # cookie_httponly: true
      # cookie_samesite: Lax
      # token_length: 32
      # token_ttl: 3600
      # excluded_paths: []

    # ── CORS ───────────────────────────────────────────────────────────────
    # cors:
    #   enabled: true
    #   allowed_origins:
    #     - http://localhost:8000        # this demo
    #   allow_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    #   allow_headers: ["*"]
    #   allow_credentials: false
    #   max_age: 600

  # ── Rate Limiting ──────────────────────────────────────────────────────────
  # rate_limit:
  #   enabled: false
  #   default_limit: 100
  #   default_window: 60
  #   whitelist_ips: []
  #   storage_backend: memory


# ── Content Gen ──────────────────────────────────────────────────────────────
# Demo-specific settings for the content generation demo.  The
# ContentGenProvider reads this section automatically via
# config_key="content_gen" / config_model=ContentGenConfig.
#
# This demo uses ScriptedLLMClient — a deterministic test stand-in that
# returns pre-defined responses based on prompt keywords.  No real LLM
# calls are made, making tests fast and deterministic.
#
# To use a real LLM client (e.g. OllamaClient), replace ScriptedLLMClient
# in the provider's boot() method.
# ─────────────────────────────────────────────────────────────────────────────
content_gen:
  default_style: "professional"        # writing style: professional | casual | technical
  max_retries: 3                       # maximum retry attempts on LLM failure
  # model_name: "llama3"               # model name (for real LLM clients)
  # temperature: 0.7                   # sampling temperature
  # max_tokens: 1024                   # maximum tokens in response
  # timeout: 30                        # request timeout in seconds
