<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta charset="utf-8" />
  <title>Log in — auth-web</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="login">
<nav class="demo-nav">
  <a href="/" class="nav-brand"><img src="/static/logo.png" alt="" class="nav-logo"> Lexigram</a>
  <span class="nav-demo">Auth Web</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>
<main class="auth-shell">
<div class="auth-content">

  <header>
    <h1>Log in</h1>
    <p class="muted">Sign in to your account</p>
  </header>
  <div class="card">
    <p id="error" class="error"></p>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" placeholder="email" required />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" placeholder="password" required />
      <button type="submit">Log in</button>
    </form>
    <div class="auth-footer"><p class="muted">Need an account? <a href="/register">Register</a></p></div>
  </div>

  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev">Lexigram</a></div>
</div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      const form = new FormData(event.target);
      const result = await api("/api/login", {
        method: "POST",
        body: JSON.stringify({
          email: form.get("email"),
          password: form.get("password"),
        }),
      });
      if (result.ok) {
        window.location.href = "/profile";
      } else {
        showError(result.body.error || "Login failed");
      }
    });
  </script>
</div>
</main>
</body>
</html>
