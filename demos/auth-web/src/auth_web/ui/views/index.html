<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta charset="utf-8" />
  <title>auth-web</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="index">
<nav class="demo-nav">
  <a href="/" class="nav-brand">Lexigram</a>
  <span class="nav-demo">Auth Web</span>
  <div class="nav-links">
    <a href="https://lexigram.dev" target="_blank" rel="noopener">Docs</a>

  </div>
</nav>
<header>
  <h1>auth-web</h1>
  <p class="muted">Checking session…</p>
</header>
<main class="auth-shell">
<div class="auth-content">

  <div class="card">
    <p id="error" class="muted">Checking session…</p>
  </div>

  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://lexigram.dev" target="_blank" rel="noopener">Lexigram</a></div>
</div>
  <script>
    (async () => {
      try {
        const me = await api("/api/me");
        window.location.href = me.ok ? "/profile" : "/login";
      } catch (error) {
        showError(`Session check failed: ${error.message}`);
      }
    })();
  </script>
</div>
</main>
</body>
</html>
