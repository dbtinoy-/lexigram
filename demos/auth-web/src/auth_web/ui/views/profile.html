<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile — auth-web</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="profile">
  <div class="logo-header"><img src="/static/logo.png" alt="Lexigram"><h1 class="accent">Profile</h1></div>
  <div class="card" id="identity">
    <p class="muted">Loading…</p>
  </div>
  <div class="card">
    <div class="row"><strong>Token claims</strong></div>
    <pre id="claims" class="muted"></pre>
  </div>
  <div class="card">
    <div class="row"><strong>Active sessions</strong></div>
    <table>
      <thead><tr><th>Session</th><th>Expires</th><th></th></tr></thead>
      <tbody id="sessions"></tbody>
    </table>
  </div>
  <nav>
    <a href="/password">Change password</a>
    <a href="#" id="logout">Log out</a>
  </nav>
  <script src="/static/app.js"></script>
  <div class="demo-footer"><img src="/static/logo.png" class="footer-logo" alt=""> Powered by <a href="https://lexigram.dev">Lexigram</a></div>
  <script>
    async function loadProfile() {
      const me = await api("/api/me");
      if (!me.ok) {
        window.location.href = "/login";
        return;
      }
      const profile = await api("/api/profile");
      if (!profile.ok) {
        window.location.href = "/login";
        return;
      }
      document.getElementById("identity").innerHTML =
        `<div class="row"><span>${profile.body.user.name}</span>` +
        `<span class="muted">${profile.body.user.email}</span></div>` +
        `<div class="muted">roles: ${profile.body.claims.roles.join(", ") || "—"}</div>`;
      document.getElementById("claims").textContent = JSON.stringify(
        { roles: profile.body.claims.roles,
          permissions: profile.body.claims.permissions,
          key_id: profile.body.claims.key_id,
          expires_at: profile.body.claims.expires_at },
        null, 2
      );
      const rows = profile.body.sessions
        .map((session) =>
          `<tr><td><code>${session.session_id.slice(0, 18)}…</code></td>` +
          `<td class="muted">${session.expires_at ?? ""}</td>` +
          `<td><button class="secondary" data-session="${session.session_id}">Revoke</button></td></tr>`)
        .join("");
      document.getElementById("sessions").innerHTML = rows;
      for (const button of document.querySelectorAll("button[data-session]")) {
        button.addEventListener("click", async () => {
          await api(`/api/sessions/${button.dataset.session}/revoke`, { method: "POST" });
          loadProfile();
        });
      }
    }

    document.getElementById("logout").addEventListener("click", async (event) => {
      event.preventDefault();
      await api("/api/logout", { method: "POST" });
      window.location.href = "/login";
    });

    loadProfile();
  </script>
</body>
</html>
