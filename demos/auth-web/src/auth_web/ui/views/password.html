<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Change password — auth-web</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="password">
  <h1 class="accent">Change password</h1>
  <div class="card">
    <p id="error" class="error"></p>
    <p id="ok" class="ok"></p>
    <form id="password-form">
      <input name="current_password" type="password" placeholder="current password" required />
      <input name="new_password" type="password" placeholder="new password" required />
      <input name="confirm_password" type="password" placeholder="confirm new password" required />
      <button type="submit">Update password</button>
    </form>
    <nav><a href="/profile">← Back to profile</a></nav>
  </div>
  <script src="/static/app.js"></script>
  <script>
    document.getElementById("password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      showOk("");
      const form = new FormData(event.target);
      const result = await api("/api/profile/password", {
        method: "POST",
        body: JSON.stringify(Object.fromEntries(form)),
      });
      if (result.ok) {
        showOk("Password changed.");
        event.target.reset();
      } else {
        showError(result.body.error || "Change failed");
      }
    });
  </script>
</body>
</html>
