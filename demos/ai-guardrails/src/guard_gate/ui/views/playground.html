<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Guardrails Playground</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand"><img src="/static/logo.png" alt="" class="nav-logo"> Lexigram</a>
  <span class="nav-demo">AI Guardrails</span>
  <div class="nav-links">
    <a href="https://lexigram.dev">Docs</a>
    <a href="https://github.com/dbtinoy-/lexigram">GitHub</a>
  </div>
</nav>

  <header>
    <img src="/static/logo.png" alt="" class="logo">
    <h1>Guardrails Playground</h1>
    <p class="muted">No LLM running — replies are canned. This demo proves guards, budgets, and audit trail.</p>
  </header>
  <main>
    <section id="console">
      <div class="row">
        <label>Protection <input type="checkbox" id="policy-toggle" checked></label>
      </div>
      <div id="acts">
        <button data-act="injection">Injection</button>
        <button data-act="pii">PII</button>
        <button data-act="length">Oversize</button>
        <button data-act="model">Restricted model</button>
        <button data-act="budget">Drain budget</button>
      </div>
      <form id="ask-form">
        <input id="text" type="text" autocomplete="off"
               placeholder="Try &quot;Email me at a@b.com about my order&quot;">
        <select id="model">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-5-restricted">gpt-5-restricted</option>
        </select>
        <button type="submit">Ask</button>
      </form>
      <div id="outcomes"></div>
      <p id="error" class="hidden"></p>
    </section>
    <aside>
      <h2>Budget</h2>
      <p id="state" class="muted"></p>
      <h2>Audit trail</h2>
      <table id="audit"><thead><tr><th>event</th><th>status</th><th>cost</th></tr></thead>
        <tbody id="audit-body"></tbody></table>
    </aside>
  </main>
  <script src="/static/app.js"></script>
  <footer class="demo-footer">
    <span>Powered by <a href="https://lexigram.dev" target="_blank" rel="noopener">Lexigram</a></span>
  </footer>
</body>
</html>
