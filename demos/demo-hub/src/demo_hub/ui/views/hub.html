<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lexigram Live Demos</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Lexigram Live Demos</h1>
    <p class="sandbox">Sandbox &mdash; in-memory state resets often; auth consoles use seeded demo credentials.</p>
    <div id="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="capability">Capability</button>
      <button data-f="auth">Auth</button>
    </div>
  </header>

  <main>
    <div id="cards" class="grid"></div>
  </main>

  <footer>
    <a href="https://docs.lexigram.dev" target="_blank" rel="noopener">Docs</a>
    <span class="sep">&middot;</span>
    <a href="https://github.com/dbtinoy/lexigram" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
