  #   enable_auto_commit: true
  #   timeout: 30
  #   reconnect_attempts: 3
  #   reconnect_delay: 1.0
  #   enable_logging: true


# ── Timeline Lab ─────────────────────────────────────────────────────────────
# Demo-specific settings for the timeline viewer.
# Consumed by TimelineLabConfig (config_section="timeline_lab").
# ─────────────────────────────────────────────────────────────────────────────
timeline_lab:
  enabled: true                     # toggle the provider and controller
  stream_id: demo-stream            # default stream name for the viewer
  default_actor: demo-user          # actor label when none specified
