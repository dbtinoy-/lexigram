<div class="grid grid-cols-2 gap-3 p-1">
  <div class="rounded-lg bg-gray-100 p-3 text-center border border-gray-200">
    <div class="text-2xl font-bold text-gray-900">{{ pending }}</div>
    <div class="text-xs text-gray-600 mt-0.5">Pending</div>
  </div>
  <div class="rounded-lg bg-blue-50 p-3 text-center border border-blue-200">
    <div class="text-2xl font-bold text-blue-700">{{ running }}</div>
    <div class="text-xs text-blue-600 mt-0.5">Running</div>
  </div>
  <div class="rounded-lg bg-green-50 p-3 text-center border border-green-200">
    <div class="text-2xl font-bold text-green-700">{{ completed }}</div>
    <div class="text-xs text-green-600 mt-0.5">Completed</div>
  </div>
  <div class="rounded-lg bg-red-50 p-3 text-center border border-red-200">
    <div class="text-2xl font-bold text-red-700">{{ failed }}</div>
    <div class="text-xs text-red-600 mt-0.5">Failed</div>
  </div>
</div>
