# Copy to application.yaml and adjust to your deployment. Remove sections you don't use.
# Full field reference: see the README Configuration section.
# YAML key: multimedia: → beat:
# Environment variable prefix: LEX_MULTIMEDIA__BEAT__
#
# NOTE: lexigram-multimedia-beat is a subsystem of the lexigram-multimedia
# umbrella. In application.yaml its config is nested under the `multimedia:`
# key. For standalone use, pass a BeatAnalysisConfig directly to
# BeatAnalysisModule.configure(BeatAnalysisConfig(...)).

multimedia:
  beat:
    # Beat-analysis backend to use.
    backend: "librosa"  # librosa (in-process), madmom (reference server)

    # librosa backend (in-process)
    librosa_sample_rate: 22050

    # Madmom reference server (backend: madmom)
    madmom_base_url: "http://localhost:5600"

    # Request timeout in seconds.
    timeout: 30.0
