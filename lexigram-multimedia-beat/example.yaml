# Copy to application.yaml and adjust to your deployment. Remove sections you don't use.
# Full field reference: see the README Configuration section.
# YAML key: multimedia_beat
# Environment variable prefix: LEX_MULTIMEDIA_BEAT__

multimedia_beat:
  # Beat-analysis backend to use.
  backend: "librosa"  # librosa (in-process), madmom (reference server)

  # librosa backend (in-process)
  librosa_sample_rate: 22050

  # Madmom reference server (backend: madmom)
  madmom_base_url: "http://localhost:5600"

  # Request timeout in seconds.
  timeout: 30.0